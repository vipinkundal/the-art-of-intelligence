        <section>
          <h2>System workflow</h2>
          <div class="lesson-graphic" aria-label="AI systems and infrastructure workflow">
            <div class="graphic-flow">
              <div class="graphic-node">
                <strong>Train at scale</strong>
                <span>Shard model state, data, activations, and communication across accelerator clusters.</span>
              </div>
              <div class="graphic-node">
                <strong>Serve efficiently</strong>
                <span>Optimize latency, throughput, memory, kernels, batching, caching, and cost per token.</span>
              </div>
              <div class="graphic-node">
                <strong>Operate reliably</strong>
                <span>Version artifacts, monitor behavior, evaluate continuously, collect traces, and recover from incidents.</span>
              </div>
            </div>
          </div>
        </section>

        <section>
          <h2>24.1 Training systems</h2>
          <p>Study:</p>
          <ul class="lesson-list two-column-list dense-list topic-detail-list">
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Data_parallelism" target="_blank" rel="noopener noreferrer" title="Wikipedia: Data parallelism">Data parallelism</a>:</strong> Replicates the model across workers while each worker processes different batches.</li>
            <li><strong><a class="wiki-term" href="https://pytorch.org/docs/stable/generated/torch.nn.parallel.DistributedDataParallel.html" target="_blank" rel="noopener noreferrer" title="PyTorch: DistributedDataParallel">Distributed data parallel</a>:</strong> Synchronizes gradients across replicas, commonly through all-reduce communication.</li>
            <li><strong><a class="wiki-term" href="https://pytorch.org/docs/stable/fsdp.html" target="_blank" rel="noopener noreferrer" title="PyTorch: Fully Sharded Data Parallel">Fully sharded data parallel</a>:</strong> Shards parameters, gradients, and optimizer states across workers to reduce per-device memory.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/1910.02054" target="_blank" rel="noopener noreferrer" title="arXiv: ZeRO">ZeRO</a>:</strong> Partitions optimizer states, gradients, and parameters across data-parallel ranks.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/1909.08053" target="_blank" rel="noopener noreferrer" title="arXiv: Megatron-LM">Tensor parallelism</a>:</strong> Splits tensor operations and model layers across devices.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Pipeline_(computing)" target="_blank" rel="noopener noreferrer" title="Wikipedia: Pipeline (computing)">Pipeline parallelism</a>:</strong> Splits model layers into stages and pipelines microbatches across devices.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2205.05198" target="_blank" rel="noopener noreferrer" title="arXiv: Reducing Activation Recomputation in Large Transformer Models">Sequence parallelism</a>:</strong> Splits sequence dimensions across devices to reduce memory or communication cost.</li>
            <li><strong><a class="wiki-term" href="https://docs.nvidia.com/nemo-framework/user-guide/latest/nemotoolkit/features/parallelisms.html" target="_blank" rel="noopener noreferrer" title="NVIDIA NeMo: Parallelisms">Context parallelism</a>:</strong> Distributes long-context computation across devices or partitions.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2101.03961" target="_blank" rel="noopener noreferrer" title="arXiv: Switch Transformers">Expert parallelism</a>:</strong> Routes sparse mixture-of-experts computation across expert shards.</li>
            <li><strong><a class="wiki-term" href="https://huggingface.co/docs/transformers/main/en/perf_train_gpu_one#gradient-accumulation" target="_blank" rel="noopener noreferrer" title="Hugging Face: Gradient accumulation">Gradient accumulation</a>:</strong> Accumulates gradients over microbatches to simulate a larger batch size.</li>
            <li><strong><a class="wiki-term" href="https://pytorch.org/docs/stable/checkpoint.html" target="_blank" rel="noopener noreferrer" title="PyTorch: Activation checkpointing">Activation checkpointing</a>:</strong> Saves memory by recomputing selected activations during backpropagation.</li>
            <li><strong><a class="wiki-term" href="https://pytorch.org/docs/stable/data.html" target="_blank" rel="noopener noreferrer" title="PyTorch: Data loading">Asynchronous data loading</a>:</strong> Keeps accelerators fed by overlapping input loading, preprocessing, and host-to-device transfer.</li>
            <li><strong><a class="wiki-term" href="https://huggingface.co/docs/accelerate/main/en/usage_guides/fsdp" target="_blank" rel="noopener noreferrer" title="Hugging Face Accelerate: FSDP">Checkpoint sharding</a>:</strong> Stores model checkpoints in shards suitable for distributed loading and recovery.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Fault_tolerance" target="_blank" rel="noopener noreferrer" title="Wikipedia: Fault tolerance">Fault tolerance</a>:</strong> Recovers from worker failures, preemptions, corrupted checkpoints, or transient infrastructure issues.</li>
            <li><strong><a class="wiki-term" href="https://docs.nvidia.com/deeplearning/nccl/user-guide/docs/usage/collectives.html" target="_blank" rel="noopener noreferrer" title="NVIDIA NCCL: Collective operations">Network collectives</a>:</strong> Coordinate communication patterns such as reductions, gathers, and scatters across devices.</li>
            <li><strong><a class="wiki-term" href="https://docs.nvidia.com/deeplearning/nccl/user-guide/docs/usage/collectives.html" target="_blank" rel="noopener noreferrer" title="NVIDIA NCCL: Collective operations">All-reduce</a>:</strong> Aggregates values across workers and returns the result to every worker.</li>
            <li><strong><a class="wiki-term" href="https://docs.nvidia.com/deeplearning/nccl/user-guide/docs/usage/collectives.html" target="_blank" rel="noopener noreferrer" title="NVIDIA NCCL: Collective operations">All-gather</a>:</strong> Collects shards from all workers so each worker receives the full set.</li>
            <li><strong><a class="wiki-term" href="https://docs.nvidia.com/deeplearning/nccl/user-guide/docs/usage/collectives.html" target="_blank" rel="noopener noreferrer" title="NVIDIA NCCL: Collective operations">Reduce-scatter</a>:</strong> Reduces values and scatters shards of the reduced result across workers.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/NVLink" target="_blank" rel="noopener noreferrer" title="Wikipedia: NVLink">GPU topology</a>:</strong> Accounts for device interconnects, nodes, links, and bandwidth when placing parallel work.</li>
            <li><strong><a class="wiki-term" href="https://docs.nvidia.com/deeplearning/nccl/user-guide/docs/usage/streams.html" target="_blank" rel="noopener noreferrer" title="NVIDIA NCCL: CUDA streams">Compute and communication overlap</a>:</strong> Hides communication latency by scheduling communication alongside useful computation.</li>
          </ul>
          <p>
            Modern large-model courses explicitly include FLOPs, memory, arithmetic intensity, GPUs, custom kernels, distributed training, and scaling analysis.
          </p>
        </section>

        <section>
          <h2>24.2 Efficient inference</h2>
          <p>Learn:</p>
          <ul class="lesson-list two-column-list dense-list topic-detail-list">
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2309.06180" target="_blank" rel="noopener noreferrer" title="arXiv: Efficiently Programming Large Language Models using SGLang">Continuous batching</a>:</strong> Dynamically packs requests into batches as they arrive and finish.</li>
            <li><strong><a class="wiki-term" href="https://docs.nvidia.com/deeplearning/triton-inference-server/user-guide/docs/user_guide/batcher.html" target="_blank" rel="noopener noreferrer" title="NVIDIA Triton: Dynamic batcher">Dynamic batching</a>:</strong> Groups requests within a short window to improve hardware utilization.</li>
            <li><strong><a class="wiki-term" href="https://huggingface.co/docs/transformers/main/cache_explanation" target="_blank" rel="noopener noreferrer" title="Hugging Face: KV cache strategies">KV caching</a>:</strong> Stores key-value tensors from prior tokens to avoid recomputing attention history.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2309.06180" target="_blank" rel="noopener noreferrer" title="arXiv: Efficiently Programming Large Language Models using SGLang">Paged KV cache</a>:</strong> Manages KV memory in blocks to reduce fragmentation and improve serving throughput.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2309.06180" target="_blank" rel="noopener noreferrer" title="arXiv: Efficiently Programming Large Language Models using SGLang">Prefix caching</a>:</strong> Reuses cached computation for shared prompt prefixes.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Quantization_(signal_processing)" target="_blank" rel="noopener noreferrer" title="Wikipedia: Quantization">Quantization</a>:</strong> Reduces numeric precision to lower memory bandwidth, storage, and compute cost.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2210.17323" target="_blank" rel="noopener noreferrer" title="arXiv: GPTQ">GPTQ-style post-training quantization</a>:</strong> Quantizes pretrained weights with calibration data and approximate second-order correction.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2306.00978" target="_blank" rel="noopener noreferrer" title="arXiv: AWQ">AWQ-style activation-aware quantization</a>:</strong> Preserves important weight channels based on activation sensitivity.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2211.10438" target="_blank" rel="noopener noreferrer" title="arXiv: SmoothQuant">SmoothQuant concepts</a>:</strong> Smooths activation outliers into weights to make lower-precision inference easier.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Speculative_decoding" target="_blank" rel="noopener noreferrer" title="Wikipedia: Speculative decoding">Speculative decoding</a>:</strong> Uses a smaller draft model and verifies tokens with a larger model to reduce latency.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/1909.08053" target="_blank" rel="noopener noreferrer" title="arXiv: Megatron-LM">Tensor parallel serving</a>:</strong> Splits inference computation across multiple accelerators.</li>
            <li><strong><a class="wiki-term" href="https://docs.nvidia.com/deeplearning/triton-inference-server/user-guide/docs/user_guide/architecture.html" target="_blank" rel="noopener noreferrer" title="NVIDIA Triton: Architecture">Pipeline serving</a>:</strong> Serves model stages across devices, often trading latency for capacity.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2401.08671" target="_blank" rel="noopener noreferrer" title="arXiv: Splitwise">Disaggregated prefill and decode</a>:</strong> Separates prompt processing from token generation to optimize each phase independently.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2309.06180" target="_blank" rel="noopener noreferrer" title="arXiv: Efficiently Programming Large Language Models using SGLang">Request scheduling</a>:</strong> Chooses which requests run, batch, preempt, or resume under latency and memory constraints.</li>
            <li><strong><a class="wiki-term" href="https://huggingface.co/docs/accelerate/main/en/usage_guides/big_modeling" target="_blank" rel="noopener noreferrer" title="Hugging Face Accelerate: Big model inference">Memory offloading</a>:</strong> Moves weights, caches, or intermediate state between device, host, and storage tiers.</li>
            <li><strong><a class="wiki-term" href="https://pytorch.org/docs/stable/torch.compiler.html" target="_blank" rel="noopener noreferrer" title="PyTorch: torch.compile">Model compilation</a>:</strong> Lowers model graphs into optimized kernels or execution plans.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Loop_fission_and_fusion" target="_blank" rel="noopener noreferrer" title="Wikipedia: Loop fission and fusion">Kernel fusion</a>:</strong> Combines operations into fewer kernels to reduce memory traffic and launch overhead.</li>
            <li><strong><a class="wiki-term" href="https://triton-lang.org/main/getting-started/tutorials/01-vector-add.html" target="_blank" rel="noopener noreferrer" title="Triton: Vector addition tutorial">CUDA and Triton fundamentals</a>:</strong> Provide the programming model behind many custom GPU kernels.</li>
          </ul>
        </section>

        <section>
          <h2>Key performance concepts</h2>
          <ul class="lesson-list two-column-list dense-list topic-detail-list">
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Network_throughput" target="_blank" rel="noopener noreferrer" title="Wikipedia: Network throughput">Throughput</a>:</strong> Amount of work completed per unit time.</li>
            <li><strong><a class="wiki-term" href="https://docs.nvidia.com/deeplearning/triton-inference-server/user-guide/docs/user_guide/metrics.html" target="_blank" rel="noopener noreferrer" title="NVIDIA Triton: Metrics">Time to first token</a>:</strong> Delay before the first generated token is returned.</li>
            <li><strong><a class="wiki-term" href="https://docs.nvidia.com/deeplearning/triton-inference-server/user-guide/docs/user_guide/metrics.html" target="_blank" rel="noopener noreferrer" title="NVIDIA Triton: Metrics">Inter-token latency</a>:</strong> Delay between successive generated tokens.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Tail_latency" target="_blank" rel="noopener noreferrer" title="Wikipedia: Tail latency">Tail latency</a>:</strong> Slow-end latency, often measured at p95, p99, or worse percentiles.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Memory_bandwidth" target="_blank" rel="noopener noreferrer" title="Wikipedia: Memory bandwidth">Memory bandwidth</a>:</strong> Rate at which data moves between memory and compute units.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Roofline_model" target="_blank" rel="noopener noreferrer" title="Wikipedia: Roofline model">Arithmetic intensity</a>:</strong> Ratio of compute operations to memory traffic.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Utilization" target="_blank" rel="noopener noreferrer" title="Wikipedia: Utilization">Compute utilization</a>:</strong> Fraction of available accelerator compute actually used.</li>
            <li><strong><a class="wiki-term" href="https://docs.nvidia.com/deeplearning/triton-inference-server/user-guide/docs/user_guide/metrics.html" target="_blank" rel="noopener noreferrer" title="NVIDIA Triton: Metrics">Tokens per second</a>:</strong> Generation or processing rate for token workloads.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Unit_cost" target="_blank" rel="noopener noreferrer" title="Wikipedia: Unit cost">Cost per million tokens</a>:</strong> Serving cost normalized by token volume.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Energy_consumption" target="_blank" rel="noopener noreferrer" title="Wikipedia: Energy consumption">Energy use</a>:</strong> Power and energy required to train or serve the system.</li>
          </ul>
        </section>

        <section>
          <h2>24.3 MLOps and LLMOps</h2>
          <p>Understand:</p>
          <ul class="lesson-list two-column-list dense-list topic-detail-list">
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Data_version_control" target="_blank" rel="noopener noreferrer" title="Wikipedia: Data version control">Data versioning</a>:</strong> Tracks datasets, splits, preprocessing, labels, and lineage over time.</li>
            <li><strong><a class="wiki-term" href="https://mlflow.org/docs/latest/ml/tracking/" target="_blank" rel="noopener noreferrer" title="MLflow: Tracking">Experiment tracking</a>:</strong> Records runs, metrics, hyperparameters, code versions, artifacts, and notes.</li>
            <li><strong><a class="wiki-term" href="https://mlflow.org/docs/latest/ml/model-registry/" target="_blank" rel="noopener noreferrer" title="MLflow: Model Registry">Model registries</a>:</strong> Manage model versions, metadata, approvals, promotion, and deployment status.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Feature_store" target="_blank" rel="noopener noreferrer" title="Wikipedia: Feature store">Feature stores</a>:</strong> Provide governed, reusable features for training and serving.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Reproducibility" target="_blank" rel="noopener noreferrer" title="Wikipedia: Reproducibility">Reproducible pipelines</a>:</strong> Make data processing, training, evaluation, and deployment repeatable.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Continuous_integration" target="_blank" rel="noopener noreferrer" title="Wikipedia: Continuous integration">Continuous integration</a>:</strong> Tests model code, data transforms, pipelines, and system contracts before release.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Continuous_deployment" target="_blank" rel="noopener noreferrer" title="Wikipedia: Continuous deployment">Continuous deployment</a>:</strong> Releases models and services through automated, controlled deployment paths.</li>
            <li><strong><a class="wiki-term" href="https://martinfowler.com/bliki/CanaryRelease.html" target="_blank" rel="noopener noreferrer" title="Martin Fowler: Canary Release">Shadow deployment</a>:</strong> Runs a candidate system beside production without serving user-visible results.</li>
            <li><strong><a class="wiki-term" href="https://martinfowler.com/bliki/CanaryRelease.html" target="_blank" rel="noopener noreferrer" title="Martin Fowler: Canary Release">Canary deployment</a>:</strong> Gradually sends a small traffic slice to a new model before broader rollout.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/A/B_testing" target="_blank" rel="noopener noreferrer" title="Wikipedia: A/B testing">A/B testing</a>:</strong> Compares variants under live or controlled traffic with defined metrics and guardrails.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Concept_drift" target="_blank" rel="noopener noreferrer" title="Wikipedia: Concept drift">Drift detection</a>:</strong> Detects input, label, prediction, or performance distribution changes.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Application_performance_management" target="_blank" rel="noopener noreferrer" title="Wikipedia: Application performance management">Monitoring</a>:</strong> Tracks reliability, latency, cost, quality, safety, and data health in production.</li>
            <li><strong><a class="wiki-term" href="https://mlflow.org/docs/latest/ml/evaluation/" target="_blank" rel="noopener noreferrer" title="MLflow: Model evaluation">Evaluation pipelines</a>:</strong> Run repeatable offline and online evaluations for models, prompts, and retrieval systems.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Software_versioning" target="_blank" rel="noopener noreferrer" title="Wikipedia: Software versioning">Prompt versioning</a>:</strong> Tracks prompt templates, system messages, tools, policies, and evaluation results.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Data_version_control" target="_blank" rel="noopener noreferrer" title="Wikipedia: Data version control">Retrieval-index versioning</a>:</strong> Versions embeddings, chunking, metadata, documents, and index configurations.</li>
            <li><strong><a class="wiki-term" href="https://opentelemetry.io/docs/concepts/signals/traces/" target="_blank" rel="noopener noreferrer" title="OpenTelemetry: Traces">Trace collection</a>:</strong> Captures request flows, tool calls, retrieval results, model outputs, and latency spans.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Feedback" target="_blank" rel="noopener noreferrer" title="Wikipedia: Feedback">Feedback collection</a>:</strong> Gathers human ratings, corrections, implicit signals, and failure reports.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Rollback" target="_blank" rel="noopener noreferrer" title="Wikipedia: Rollback">Rollback</a>:</strong> Returns to a known-good model, prompt, index, or service version after a failure.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Incident_management" target="_blank" rel="noopener noreferrer" title="Wikipedia: Incident management">Incident management</a>:</strong> Defines detection, triage, ownership, mitigation, communication, and postmortems.</li>
          </ul>
        </section>

        <section>
          <h2>Why it matters for AI</h2>
          <p>
            Model quality depends on the surrounding system. Training infrastructure controls scale and reliability, inference infrastructure controls latency and cost, and operations infrastructure controls reproducibility, monitoring, deployment safety, and recovery.
          </p>
        </section>

        <section>
          <h2>Learning target</h2>
          <p>
            You should be able to explain major training parallelism strategies, key collective communication patterns, inference caching and batching methods, quantization and compilation concepts, performance metrics, deployment strategies, versioning needs, monitoring workflows, and incident-management practices for AI systems.
          </p>
