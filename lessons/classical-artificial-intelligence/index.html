        <section class="lesson-graphic" aria-labelledby="classical-ai-map-title">
          <h2 id="classical-ai-map-title">Classical AI problem-solving loop</h2>
          <div class="graphic-flow" aria-label="Classical AI maps a goal into a model, searches or reasons over options, then chooses an action plan.">
            <div class="graphic-node">
              <strong>Model the world</strong>
              <span>States, rules, constraints, facts, goals.</span>
            </div>
            <div class="graphic-node">
              <strong>Explore possibilities</strong>
              <span>Search trees, game trees, proofs, plans.</span>
            </div>
            <div class="graphic-node">
              <strong>Commit to action</strong>
              <span>Choose a path, assignment, proof, or plan.</span>
            </div>
          </div>
        </section>

        <section>
          <h2>3.1 Search algorithms</h2>
          <p>Learn and implement:</p>
          <ul class="lesson-list two-column-list dense-list topic-detail-list">
            <li><strong><a class="wiki-term" href="topics/breadth-first-search/index.html">Breadth-first search</a>:</strong> Expands the shallowest states first, so it finds the shortest path when every step has the same cost.</li>
            <li><strong><a class="wiki-term" href="topics/depth-first-search/index.html">Depth-first search</a>:</strong> Follows one branch deeply before backtracking, which saves memory but can miss shorter answers without safeguards.</li>
            <li><strong><a class="wiki-term" href="topics/depth-limited-search/index.html">Depth-limited search</a>:</strong> Caps how far DFS can go, making it useful when infinite branches or cycles are possible.</li>
            <li><strong><a class="wiki-term" href="topics/iterative-deepening/index.html">Iterative deepening</a>:</strong> Repeats depth-limited search with larger limits, combining BFS-like completeness with DFS-like memory use.</li>
            <li><strong><a class="wiki-term" href="topics/uniform-cost-search/index.html">Uniform-cost search</a>:</strong> Expands the cheapest path so far, which is essential when actions have different costs.</li>
            <li><strong><a class="wiki-term" href="topics/dijkstras-algorithm/index.html">Dijkstra's algorithm</a>:</strong> Computes shortest paths from a start node when edge costs are non-negative.</li>
            <li><strong><a class="wiki-term" href="topics/bidirectional-search/index.html">Bidirectional search</a>:</strong> Searches forward from the start and backward from the goal to reduce the explored state space.</li>
            <li><strong><a class="wiki-term" href="topics/greedy-best-first-search/index.html">Greedy best-first search</a>:</strong> Chases the state that appears closest to the goal, making it fast but not necessarily optimal.</li>
            <li><strong><a class="wiki-term" href="topics/a-star/index.html">A*</a>:</strong> Balances path cost so far with estimated remaining cost to find optimal paths when the heuristic is valid.</li>
            <li><strong><a class="wiki-term" href="topics/weighted-a-star/index.html">Weighted A*</a>:</strong> Gives the heuristic extra influence, often trading perfect optimality for faster solutions.</li>
            <li><strong><a class="wiki-term" href="topics/iterative-deepening-a-star/index.html">Iterative Deepening A*</a>:</strong> Uses increasing cost thresholds to get A* style guidance with lower memory usage.</li>
            <li><strong><a class="wiki-term" href="topics/beam-search/index.html">Beam search</a>:</strong> Keeps only the best few candidate states at each layer, useful when full search is too expensive.</li>
            <li><strong><a class="wiki-term" href="topics/branch-and-bound/index.html">Branch and bound</a>:</strong> Prunes branches that cannot beat the best solution found so far.</li>
            <li><strong><a class="wiki-term" href="topics/hill-climbing/index.html">Hill climbing</a>:</strong> Moves to a better neighboring state repeatedly, which is simple but can get stuck on local optima.</li>
            <li><strong><a class="wiki-term" href="topics/random-restart-hill-climbing/index.html">Random-restart hill climbing</a>:</strong> Runs hill climbing from many starting points to escape unlucky local optima.</li>
            <li><strong><a class="wiki-term" href="topics/simulated-annealing/index.html">Simulated annealing</a>:</strong> Sometimes accepts worse moves early on, then gradually becomes more selective.</li>
            <li><strong><a class="wiki-term" href="topics/tabu-search/index.html">Tabu search</a>:</strong> Remembers recent choices to avoid cycling back to the same unhelpful states.</li>
            <li><strong><a class="wiki-term" href="topics/local-beam-search/index.html">Local beam search</a>:</strong> Tracks several candidate states in parallel so promising regions can compete.</li>
          </ul>
        </section>

        <section>
          <h2>A* evaluation</h2>
          <div class="formula-display" aria-label="A star evaluation formula">
            <code>f(n) = g(n) + h(n)</code>
          </div>
          <p>
            where <code>g(n)</code> is the path cost so far and <code>h(n)</code> estimates the remaining cost.
          </p>
        </section>

        <section>
          <h2>Understand</h2>
          <ul class="lesson-list dense-list topic-detail-list">
            <li><strong><a class="wiki-term" href="topics/admissible-heuristics/index.html">Admissible heuristics</a>:</strong> Estimates that never overstate the remaining cost, preserving optimality for A*.</li>
            <li><strong><a class="wiki-term" href="topics/consistent-heuristics/index.html">Consistent heuristics</a>:</strong> Estimates that obey a triangle-inequality style rule, preventing A* from needing repeated repairs.</li>
            <li><strong><a class="wiki-term" href="topics/completeness/index.html">Completeness</a>:</strong> Whether an algorithm is guaranteed to find a solution when one exists.</li>
            <li><strong><a class="wiki-term" href="topics/optimality/index.html">Optimality</a>:</strong> Whether the solution found is guaranteed to be the best according to the objective.</li>
            <li><strong><a class="wiki-term" href="topics/time-and-memory-complexity/index.html">Time and memory complexity</a>:</strong> How search effort grows with branching factor, depth, and stored frontier size.</li>
            <li><strong><a class="wiki-term" href="topics/state-space-representation/index.html">State-space representation</a>:</strong> The choice of variables, actions, and transitions that defines what the search can reason about.</li>
            <li><strong><a class="wiki-term" href="topics/duplicate-state-detection/index.html">Duplicate-state detection</a>:</strong> Avoids re-expanding the same state through different paths, which is often the difference between feasible and impossible search.</li>
          </ul>
        </section>

        <section>
          <h2>3.2 Adversarial search and games</h2>
          <p>Learn:</p>
          <ul class="lesson-list two-column-list dense-list topic-detail-list">
            <li><strong><a class="wiki-term" href="topics/minimax/index.html">Minimax</a>:</strong> Chooses moves assuming the opponent will also choose the best reply.</li>
            <li><strong><a class="wiki-term" href="topics/alpha-beta-pruning/index.html">Alpha-beta pruning</a>:</strong> Skips branches that cannot change the minimax decision, preserving the answer while saving work.</li>
            <li><strong><a class="wiki-term" href="topics/negamax/index.html">Negamax</a>:</strong> Rewrites two-player zero-sum search with one symmetric value function.</li>
            <li><strong><a class="wiki-term" href="topics/expectimax/index.html">Expectimax</a>:</strong> Handles random events or stochastic opponents by averaging possible outcomes.</li>
            <li><strong><a class="wiki-term" href="topics/iterative-deepening/index.html">Iterative deepening</a>:</strong> Searches deeper and deeper game trees, keeping the best move available if time runs out.</li>
            <li><strong><a class="wiki-term" href="topics/transposition-tables/index.html">Transposition tables</a>:</strong> Cache positions reached by different move orders so the game tree behaves more like a graph.</li>
            <li><strong><a class="wiki-term" href="topics/monte-carlo-tree-search/index.html">Monte Carlo Tree Search</a>:</strong> Builds a search tree by simulating many possible continuations and focusing on promising moves.</li>
            <li><strong><a class="wiki-term" href="topics/uct/index.html">UCT</a>:</strong> Selects MCTS branches by balancing high average reward with under-explored actions.</li>
            <li><strong><a class="wiki-term" href="topics/counterfactual-regret-minimization/index.html">Counterfactual regret minimization</a>:</strong> Learns strategies by reducing regret for not having chosen alternatives at decision points.</li>
            <li><strong><a class="wiki-term" href="topics/self-play/index.html">Self-play</a>:</strong> Improves a strategy by training or evaluating it against versions of itself.</li>
          </ul>
        </section>

        <section>
          <h2>Minimax</h2>
          <div class="formula-display" aria-label="Minimax value recurrence">
            <code>V(s) = max_a V(T(s, a)) for max player; min_a V(T(s, a)) for min player</code>
          </div>
        </section>

        <section>
          <h2>UCT selection</h2>
          <div class="formula-display" aria-label="UCT selection formula">
            <code>UCT = Q(s, a) + c * sqrt(ln N(s) / N(s, a))</code>
          </div>
        </section>

        <section>
          <h2>3.3 Constraint satisfaction and satisfiability</h2>
          <p>Study:</p>
          <ul class="lesson-list two-column-list dense-list topic-detail-list">
            <li><strong><a class="wiki-term" href="topics/constraint-satisfaction-problems/index.html">Constraint-satisfaction problems</a>:</strong> Assign values to variables while satisfying rules such as all-different, ordering, or capacity constraints.</li>
            <li><strong><a class="wiki-term" href="topics/backtracking/index.html">Backtracking</a>:</strong> Builds an assignment step by step and retreats when a choice violates constraints.</li>
            <li><strong><a class="wiki-term" href="topics/forward-checking/index.html">Forward checking</a>:</strong> Removes values that would become impossible after the current assignment.</li>
            <li><strong><a class="wiki-term" href="topics/constraint-propagation/index.html">Constraint propagation</a>:</strong> Pushes implications of constraints through the problem before or during search.</li>
            <li><strong><a class="wiki-term" href="topics/arc-consistency/index.html">Arc consistency</a>:</strong> Ensures every value for one variable has at least one compatible value in a connected variable.</li>
            <li><strong><a class="wiki-term" href="topics/ac-3/index.html">AC-3</a>:</strong> A standard algorithm for repeatedly enforcing arc consistency across binary constraints.</li>
            <li><strong><a class="wiki-term" href="topics/minimum-remaining-values/index.html">Minimum remaining values</a>:</strong> Chooses the variable with the fewest legal values to expose conflicts early.</li>
            <li><strong><a class="wiki-term" href="topics/degree-heuristic/index.html">Degree heuristic</a>:</strong> Chooses the variable involved in many constraints because it can reduce the problem fastest.</li>
            <li><strong><a class="wiki-term" href="topics/least-constraining-value/index.html">Least-constraining value</a>:</strong> Tries the value that leaves the most options open for later variables.</li>
            <li><strong><a class="wiki-term" href="topics/min-conflicts/index.html">Min-conflicts</a>:</strong> Repairs a complete but inconsistent assignment by changing variables that cause conflicts.</li>
            <li><strong><a class="wiki-term" href="topics/boolean-satisfiability/index.html">Boolean satisfiability</a>:</strong> Asks whether true/false assignments can make a logical formula true.</li>
            <li><strong><a class="wiki-term" href="topics/dpll/index.html">DPLL</a>:</strong> Solves SAT with recursive splitting plus simplifications such as unit propagation.</li>
            <li><strong><a class="wiki-term" href="topics/conflict-driven-clause-learning/index.html">Conflict-driven clause learning</a>:</strong> Learns new clauses from contradictions so the solver does not repeat the same mistake.</li>
            <li><strong><a class="wiki-term" href="topics/walksat/index.html">WalkSAT</a>:</strong> Uses local search over truth assignments to quickly find satisfying assignments in many practical cases.</li>
            <li><strong><a class="wiki-term" href="topics/integer-programming/index.html">Integer programming</a>:</strong> Optimizes an objective while decision variables must take integer values.</li>
            <li><strong><a class="wiki-term" href="topics/mixed-integer-programming/index.html">Mixed-integer programming</a>:</strong> Combines integer and continuous variables for scheduling, routing, allocation, and planning tasks.</li>
          </ul>
          <p>
            These patterns are useful in scheduling, verification, program synthesis, planning, and structured generation.
          </p>
        </section>

        <section>
          <h2>3.4 Logic and symbolic reasoning</h2>
          <p>Learn:</p>
          <ul class="lesson-list two-column-list dense-list topic-detail-list">
            <li><strong><a class="wiki-term" href="topics/propositional-logic/index.html">Propositional logic</a>:</strong> Represents facts as true or false statements connected by operators such as and, or, and not.</li>
            <li><strong><a class="wiki-term" href="topics/first-order-predicate-logic/index.html">First-order predicate logic</a>:</strong> Adds objects, relations, variables, and quantified statements about a domain.</li>
            <li><strong><a class="wiki-term" href="topics/quantifiers/index.html">Quantifiers</a>:</strong> Express whether a statement applies to all objects or at least one object.</li>
            <li><strong><a class="wiki-term" href="topics/unification/index.html">Unification</a>:</strong> Finds substitutions that make two logical expressions match.</li>
            <li><strong><a class="wiki-term" href="topics/resolution/index.html">Resolution</a>:</strong> Proves statements by showing that denying the conclusion leads to contradiction.</li>
            <li><strong><a class="wiki-term" href="topics/forward-chaining/index.html">Forward chaining</a>:</strong> Starts from known facts and applies rules until new conclusions appear.</li>
            <li><strong><a class="wiki-term" href="topics/backward-chaining/index.html">Backward chaining</a>:</strong> Starts from a goal and works backward to see which facts would prove it.</li>
            <li><strong><a class="wiki-term" href="topics/horn-clauses/index.html">Horn clauses</a>:</strong> Rule-like logical clauses that support efficient inference in many expert systems.</li>
            <li><strong><a class="wiki-term" href="topics/logic-programming/index.html">Logic programming</a>:</strong> Describes relationships and rules, then lets an inference engine answer queries.</li>
            <li><strong><a class="wiki-term" href="topics/description-logic/index.html">Description logic</a>:</strong> Represents classes, properties, and relationships behind many ontology systems.</li>
            <li><strong><a class="wiki-term" href="topics/knowledge-bases/index.html">Knowledge bases</a>:</strong> Store facts and rules in a form that inference systems can query.</li>
            <li><strong><a class="wiki-term" href="topics/ontologies/index.html">Ontologies</a>:</strong> Define shared concepts and relationships so systems agree on what terms mean.</li>
            <li><strong><a class="wiki-term" href="topics/non-monotonic-reasoning/index.html">Non-monotonic reasoning</a>:</strong> Allows conclusions to be withdrawn when new evidence appears.</li>
            <li><strong><a class="wiki-term" href="topics/default-logic/index.html">Default logic</a>:</strong> Handles usual assumptions, such as treating something as true unless contradicted.</li>
            <li><strong><a class="wiki-term" href="topics/temporal-logic/index.html">Temporal logic</a>:</strong> Reasons about time, order, and eventual or always conditions.</li>
            <li><strong><a class="wiki-term" href="topics/modal-logic/index.html">Modal logic</a>:</strong> Reasons about necessity, possibility, belief, knowledge, or obligation.</li>
            <li><strong><a class="wiki-term" href="topics/fuzzy-logic/index.html">Fuzzy logic</a>:</strong> Represents graded truth rather than only true or false.</li>
            <li><strong><a class="wiki-term" href="topics/automated-theorem-proving/index.html">Automated theorem proving</a>:</strong> Uses algorithms to prove mathematical or logical statements from axioms.</li>
          </ul>
        </section>

        <section>
          <h2>Core inference pattern</h2>
          <div class="formula-display" aria-label="Modus ponens inference pattern">
            <code>P, P =&gt; Q :: Q</code>
          </div>
          <p>Also distinguish:</p>
          <ul class="lesson-list dense-list">
            <li><strong><a class="wiki-term" href="topics/deduction/index.html">Deduction</a>:</strong> rule plus fact produces a necessary conclusion.</li>
            <li><strong><a class="wiki-term" href="topics/induction/index.html">Induction</a>:</strong> observations support a general rule.</li>
            <li><strong><a class="wiki-term" href="topics/abduction/index.html">Abduction</a>:</strong> infer the best explanation.</li>
            <li><strong><a class="wiki-term" href="topics/analogy/index.html">Analogy</a>:</strong> transfer structure from a similar case.</li>
            <li><strong><a class="wiki-term" href="topics/counterfactual-reasoning/index.html">Counterfactual reasoning</a>:</strong> determine what would happen under a different intervention.</li>
          </ul>
          <p>
            Wikipedia's AI outline, glossary, and algorithm index are useful breadth-first references for these older and newer branches of AI.
          </p>
        </section>

        <section>
          <h2>3.5 Planning</h2>
          <p>Study:</p>
          <ul class="lesson-list two-column-list dense-list topic-detail-list">
            <li><strong><a class="wiki-term" href="topics/state-space-planning/index.html">State-space planning</a>:</strong> Searches through possible world states created by applying actions.</li>
            <li><strong><a class="wiki-term" href="topics/strips/index.html">STRIPS</a>:</strong> Describes actions with preconditions plus add and delete effects.</li>
            <li><strong><a class="wiki-term" href="topics/pddl/index.html">PDDL</a>:</strong> A standard planning language for defining domains, actions, objects, and goals.</li>
            <li><strong><a class="wiki-term" href="topics/forward-and-backward-planning/index.html">Forward and backward planning</a>:</strong> Forward planning starts from the initial state; backward planning regresses from the goal.</li>
            <li><strong><a class="wiki-term" href="topics/partial-order-planning/index.html">Partial-order planning</a>:</strong> Builds plans where only necessary action orderings are fixed.</li>
            <li><strong><a class="wiki-term" href="topics/graphplan/index.html">Graphplan</a>:</strong> Uses a planning graph to alternate reachable facts and actions across time steps.</li>
            <li><strong><a class="wiki-term" href="topics/hierarchical-task-networks/index.html">Hierarchical task networks</a>:</strong> Decompose high-level tasks into smaller executable subtasks.</li>
            <li><strong><a class="wiki-term" href="topics/contingent-planning/index.html">Contingent planning</a>:</strong> Creates plans with branches for different observations or outcomes.</li>
            <li><strong><a class="wiki-term" href="topics/planning-under-uncertainty/index.html">Planning under uncertainty</a>:</strong> Chooses actions when outcomes, observations, or world state are not fully known.</li>
            <li><strong><a class="wiki-term" href="topics/temporal-planning/index.html">Temporal planning</a>:</strong> Handles action durations, deadlines, concurrency, and time windows.</li>
            <li><strong><a class="wiki-term" href="topics/multi-agent-planning/index.html">Multi-agent planning</a>:</strong> Coordinates actions among multiple agents with shared or competing goals.</li>
            <li><strong><a class="wiki-term" href="topics/receding-horizon-planning/index.html">Receding-horizon planning</a>:</strong> Plans a few steps ahead, executes the first step, then replans with updated information.</li>
          </ul>
          <p>
            Modern agent systems often rediscover these ideas under names such as planner-executor, workflow orchestration, and task decomposition.
          </p>
        </section>

        <section>
          <h2>Learning target</h2>
          <p>
            You should be able to model a problem as states and transitions, choose an appropriate search strategy, explain its complexity, reason about whether it is complete or optimal, implement basic game-playing search with evaluation functions, recognize when a task should be framed as a constraint or satisfiability problem, distinguish the main symbolic reasoning patterns, and connect classical planning ideas to modern agent workflows.
          </p>
        </section>
