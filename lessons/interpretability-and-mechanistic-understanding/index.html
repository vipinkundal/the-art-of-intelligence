    <template data-lesson-page data-eyebrow="Phase 22" data-title="22. Interpretability And Mechanistic Understanding" data-summary="Interpretability studies how to explain model behavior, inspect neural representations, and identify internal mechanisms instead of treating an AI system as a black box." data-article-class="phase-article">
        <section>
          <h2>Learn three levels</h2>
          <div class="lesson-graphic" aria-label="Three levels of interpretability">
            <div class="graphic-flow">
              <div class="graphic-node">
                <strong>Model-agnostic explanations</strong>
                <span>Explain predictions from the outside using perturbations, surrogates, importance scores, and counterfactuals.</span>
              </div>
              <div class="graphic-node">
                <strong>Neural-network interpretation</strong>
                <span>Inspect gradients, saliency, activations, probes, features, and representation geometry.</span>
              </div>
              <div class="graphic-node">
                <strong>Mechanistic understanding</strong>
                <span>Find circuits, causal pathways, features, and computational structures inside trained models.</span>
              </div>
            </div>
          </div>
        </section>

        <section>
          <h2>Model-agnostic interpretation</h2>
          <p>
            These methods can be applied to many model families because they mostly treat the model as a prediction function and examine how outputs change when inputs change.
          </p>
          <ul class="lesson-list two-column-list dense-list topic-detail-list">
            <li><strong><a class="wiki-term" href="https://scikit-learn.org/stable/modules/permutation_importance.html" target="_blank" rel="noopener noreferrer" title="scikit-learn: Permutation feature importance">Permutation importance</a>:</strong> Measures performance drop after shuffling a feature, estimating how much the model relies on that feature.</li>
            <li><strong><a class="wiki-term" href="https://scikit-learn.org/stable/modules/partial_dependence.html" target="_blank" rel="noopener noreferrer" title="scikit-learn: Partial dependence and ICE plots">Partial dependence plots</a>:</strong> Show average model predictions as one or two features vary across a chosen range.</li>
            <li><strong><a class="wiki-term" href="https://christophm.github.io/interpretable-ml-book/ice.html" target="_blank" rel="noopener noreferrer" title="Interpretable Machine Learning: Individual Conditional Expectation">Individual conditional expectation</a>:</strong> Shows feature-response curves for individual examples instead of only the population average.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/1602.04938" target="_blank" rel="noopener noreferrer" title="arXiv: Why Should I Trust You?">LIME</a>:</strong> Fits a simple local surrogate model around one prediction to approximate nearby model behavior.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Shapley_value" target="_blank" rel="noopener noreferrer" title="Wikipedia: Shapley value">SHAP</a>:</strong> Assigns feature contributions using Shapley-value ideas from cooperative game theory.</li>
            <li><strong><a class="wiki-term" href="https://christophm.github.io/interpretable-ml-book/counterfactual.html" target="_blank" rel="noopener noreferrer" title="Interpretable Machine Learning: Counterfactual Explanations">Counterfactual explanations</a>:</strong> Finds small input changes that would flip or meaningfully change a prediction.</li>
            <li><strong><a class="wiki-term" href="https://christophm.github.io/interpretable-ml-book/global.html" target="_blank" rel="noopener noreferrer" title="Interpretable Machine Learning: Global surrogate models">Surrogate models</a>:</strong> Trains an interpretable model to mimic a more complex model globally or locally.</li>
          </ul>
        </section>

        <section>
          <h2>Neural-network interpretation</h2>
          <p>
            These methods inspect gradients, internal activations, spatial regions, learned directions, and representation spaces in neural networks.
          </p>
          <ul class="lesson-list two-column-list dense-list topic-detail-list">
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Saliency_map" target="_blank" rel="noopener noreferrer" title="Wikipedia: Saliency map">Saliency maps</a>:</strong> Highlight input dimensions that most affect a prediction according to gradients or related scores.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/1703.01365" target="_blank" rel="noopener noreferrer" title="arXiv: Axiomatic Attribution for Deep Networks">Integrated gradients</a>:</strong> Attribute prediction change to features by accumulating gradients from a baseline to the input.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/1610.02391" target="_blank" rel="noopener noreferrer" title="arXiv: Grad-CAM">Grad-CAM</a>:</strong> Uses gradients flowing into convolutional feature maps to localize image regions relevant to a class.</li>
            <li><strong><a class="wiki-term" href="https://christophm.github.io/interpretable-ml-book/pixel-attribution.html" target="_blank" rel="noopener noreferrer" title="Interpretable Machine Learning: Pixel attribution">Occlusion analysis</a>:</strong> Masks or removes input regions to see which parts cause prediction changes.</li>
            <li><strong><a class="wiki-term" href="https://distill.pub/2017/feature-visualization/" target="_blank" rel="noopener noreferrer" title="Distill: Feature Visualization">Feature visualization</a>:</strong> Optimizes inputs or patterns that strongly activate a neuron, channel, layer, or feature direction.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/1905.00414" target="_blank" rel="noopener noreferrer" title="arXiv: Similarity of Neural Network Representations Revisited">Representation similarity</a>:</strong> Compares activation spaces across layers, models, checkpoints, or datasets.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/1909.03368" target="_blank" rel="noopener noreferrer" title="arXiv: Designing and Interpreting Probes with Control Tasks">Linear probes</a>:</strong> Train simple classifiers on frozen activations to test what information is linearly accessible.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/1711.11279" target="_blank" rel="noopener noreferrer" title="arXiv: Testing with Concept Activation Vectors">Concept activation vectors</a>:</strong> Represent human-defined concepts as directions in activation space and test their influence.</li>
          </ul>
        </section>

        <section>
          <h2>Mechanistic interpretability</h2>
          <p>
            Mechanistic interpretability attempts to identify internal computational structures rather than only describing input-output correlations.
          </p>
          <ul class="lesson-list two-column-list dense-list topic-detail-list">
            <li><strong><a class="wiki-term" href="https://transformer-circuits.pub/2021/framework/index.html" target="_blank" rel="noopener noreferrer" title="Transformer Circuits: A Mathematical Framework">Activation patching</a>:</strong> Replaces activations from one run with activations from another to test causal influence on behavior.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2202.05262" target="_blank" rel="noopener noreferrer" title="arXiv: Locating and Editing Factual Associations in GPT">Causal tracing</a>:</strong> Tracks where information is stored and used by intervening on hidden states across layers and positions.</li>
            <li><strong><a class="wiki-term" href="https://transformer-circuits.pub/2021/framework/index.html" target="_blank" rel="noopener noreferrer" title="Transformer Circuits: A Mathematical Framework">Logit attribution</a>:</strong> Decomposes contributions to output logits across residual streams, heads, layers, or features.</li>
            <li><strong><a class="wiki-term" href="https://transformer-circuits.pub/2021/framework/index.html" target="_blank" rel="noopener noreferrer" title="Transformer Circuits: A Mathematical Framework">Attention-head analysis</a>:</strong> Studies specialized heads, attention patterns, induction behavior, copying, retrieval, or syntax-like roles.</li>
            <li><strong><a class="wiki-term" href="https://transformer-circuits.pub/2021/framework/index.html" target="_blank" rel="noopener noreferrer" title="Transformer Circuits: A Mathematical Framework">Circuit analysis</a>:</strong> Identifies subnetworks of features, heads, MLPs, and residual paths that implement a behavior.</li>
            <li><strong><a class="wiki-term" href="https://transformer-circuits.pub/2022/toy_model/index.html" target="_blank" rel="noopener noreferrer" title="Transformer Circuits: Toy Models of Superposition">Superposition</a>:</strong> Studies how models represent more features than dimensions by using overlapping directions.</li>
            <li><strong><a class="wiki-term" href="https://transformer-circuits.pub/2023/monosemantic-features/index.html" target="_blank" rel="noopener noreferrer" title="Transformer Circuits: Monosemanticity and Sparse Autoencoders">Sparse autoencoders</a>:</strong> Decompose dense activations into sparse, more interpretable feature sets.</li>
            <li><strong><a class="wiki-term" href="https://transformer-circuits.pub/2023/monosemantic-features/index.html" target="_blank" rel="noopener noreferrer" title="Transformer Circuits: Monosemanticity and Sparse Autoencoders">Feature dictionaries</a>:</strong> Build catalogs of learned features and their activation patterns for model inspection.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2304.14997" target="_blank" rel="noopener noreferrer" title="arXiv: Towards Automated Circuit Discovery for Mechanistic Interpretability">Automated circuit discovery</a>:</strong> Uses algorithms to search for model components and connections that explain a behavior.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2210.07229" target="_blank" rel="noopener noreferrer" title="arXiv: Mass-Editing Memory in a Transformer">Model editing</a>:</strong> Modifies model internals or parameters to change a targeted fact, behavior, or association.</li>
          </ul>
        </section>

        <section>
          <h2>Useful formulas and tests</h2>
          <div class="formula-stack">
            <div class="formula-row">
              <span>Permutation importance</span>
              <code>I_j = score(f, X, y) - score(f, permute_j(X), y)</code>
            </div>
            <div class="formula-row">
              <span>Integrated gradients</span>
              <code>IG_i(x) = (x_i - x'_i) integral_0^1 dF(x' + a(x - x')) / dx_i da</code>
            </div>
            <div class="formula-row">
              <span>Local surrogate</span>
              <code>explanation(x) = argmin_g L(f, g, pi_x) + Omega(g)</code>
            </div>
          </div>
        </section>

        <section>
          <h2>Why it matters for AI</h2>
          <p>
            Interpretability helps teams debug failures, detect shortcut learning, audit high-impact models, compare representations, and build more trustworthy systems. Mechanistic work becomes especially important when models are too capable or too opaque to evaluate only through aggregate benchmarks.
          </p>
        </section>

        <section>
          <h2>Learning target</h2>
          <p>
            You should be able to compare model-agnostic explanations, neural-network attribution methods, probes, feature visualization, activation patching, causal tracing, logit attribution, circuit analysis, superposition, sparse autoencoders, automated circuit discovery, and model editing, while explaining what each method can and cannot prove.
          </p>
        </section>
