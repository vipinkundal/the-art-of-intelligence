        <section>
          <h2>Pattern recognition workflow</h2>
          <div class="lesson-graphic" aria-label="Problem-solving pattern workflow">
            <div class="graphic-flow">

        <section>
          <h2>Reasoning patterns</h2>
          <ul class="lesson-list two-column-list dense-list topic-detail-list">
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Deductive_reasoning" target="_blank" rel="noopener noreferrer" title="Wikipedia: Deductive reasoning">Deduction</a>:</strong> Derives conclusions that must follow from stated premises.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Inductive_reasoning" target="_blank" rel="noopener noreferrer" title="Wikipedia: Inductive reasoning">Induction</a>:</strong> Generalizes from observed examples to broader patterns.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Abductive_reasoning" target="_blank" rel="noopener noreferrer" title="Wikipedia: Abductive reasoning">Abduction</a>:</strong> Chooses the best explanation for incomplete or surprising evidence.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Analogy" target="_blank" rel="noopener noreferrer" title="Wikipedia: Analogy">Analogy</a>:</strong> Transfers structure from a familiar problem to a new one.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Bayesian_inference" target="_blank" rel="noopener noreferrer" title="Wikipedia: Bayesian inference">Bayesian updating</a>:</strong> Revises beliefs as evidence changes likelihoods.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Causal_inference" target="_blank" rel="noopener noreferrer" title="Wikipedia: Causal inference">Causal intervention</a>:</strong> Asks what would happen if a variable were actively changed.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Counterfactual_thinking" target="_blank" rel="noopener noreferrer" title="Wikipedia: Counterfactual thinking">Counterfactual analysis</a>:</strong> Studies what would have happened under a different condition.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Case-based_reasoning" target="_blank" rel="noopener noreferrer" title="Wikipedia: Case-based reasoning">Case-based reasoning</a>:</strong> Solves new problems by adapting prior similar cases.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Means%E2%80%93ends_analysis" target="_blank" rel="noopener noreferrer" title="Wikipedia: Means–ends analysis">Means-ends analysis</a>:</strong> Compares current state to goal state and chooses actions that reduce the gap.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Statistical_hypothesis_test" target="_blank" rel="noopener noreferrer" title="Wikipedia: Statistical hypothesis test">Hypothesis generation and testing</a>:</strong> Proposes explanations and designs tests that can support or reject them.</li>
          </ul>
        </section>

        <section>
          <h2>Algorithmic patterns</h2>
          <ul class="lesson-list two-column-list dense-list topic-detail-list">
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Divide_and_conquer" target="_blank" rel="noopener noreferrer" title="Wikipedia: Divide and conquer">Divide and conquer</a>:</strong> Splits a problem into smaller independent subproblems and combines their answers.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Dynamic_programming" target="_blank" rel="noopener noreferrer" title="Wikipedia: Dynamic programming">Dynamic programming</a>:</strong> Reuses solutions to overlapping subproblems.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Memoization" target="_blank" rel="noopener noreferrer" title="Wikipedia: Memoization">Memoization</a>:</strong> Caches repeated computations so they are not recomputed.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Greedy_algorithm" target="_blank" rel="noopener noreferrer" title="Wikipedia: Greedy algorithm">Greedy optimization</a>:</strong> Makes locally best choices when that strategy is justified or useful as a heuristic.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Branch_and_bound" target="_blank" rel="noopener noreferrer" title="Wikipedia: Branch and bound">Branch and bound</a>:</strong> Searches candidate solutions while pruning regions that cannot beat the best known answer.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Backtracking" target="_blank" rel="noopener noreferrer" title="Wikipedia: Backtracking">Backtracking</a>:</strong> Builds partial solutions and retreats when constraints are violated.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Local_consistency" target="_blank" rel="noopener noreferrer" title="Wikipedia: Local consistency">Constraint propagation</a>:</strong> Uses known constraints to shrink the set of possible values.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Relaxation_(approximation)" target="_blank" rel="noopener noreferrer" title="Wikipedia: Relaxation (approximation)">Relaxation</a>:</strong> Replaces a hard problem with an easier approximate version.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Coordinate_descent" target="_blank" rel="noopener noreferrer" title="Wikipedia: Coordinate descent">Alternating optimization</a>:</strong> Optimizes one set of variables at a time while holding others fixed.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Expectation%E2%80%93maximization_algorithm" target="_blank" rel="noopener noreferrer" title="Wikipedia: Expectation–maximization algorithm">Expectation-maximization</a>:</strong> Alternates between estimating hidden variables and updating model parameters.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Sampling_(statistics)" target="_blank" rel="noopener noreferrer" title="Wikipedia: Sampling (statistics)">Sampling</a>:</strong> Uses random draws to approximate distributions, expectations, or search spaces.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Importance_sampling" target="_blank" rel="noopener noreferrer" title="Wikipedia: Importance sampling">Importance weighting</a>:</strong> Reweights examples or samples to correct for distribution mismatch.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Ensemble_averaging_(machine_learning)" target="_blank" rel="noopener noreferrer" title="Wikipedia: Ensemble averaging (machine learning)">Ensemble averaging</a>:</strong> Combines multiple predictors to reduce variance or improve robustness.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Bootstrap_aggregating" target="_blank" rel="noopener noreferrer" title="Wikipedia: Bootstrap aggregating">Bagging</a>:</strong> Trains models on resampled data and averages predictions.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Boosting_(machine_learning)" target="_blank" rel="noopener noreferrer" title="Wikipedia: Boosting (machine learning)">Boosting</a>:</strong> Trains later models to focus on examples earlier models handled poorly.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Self-play" target="_blank" rel="noopener noreferrer" title="Wikipedia: Self-play">Self-play</a>:</strong> Generates training experience through agents competing or interacting with versions of themselves.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Curriculum_learning" target="_blank" rel="noopener noreferrer" title="Wikipedia: Curriculum learning">Curriculum learning</a>:</strong> Orders tasks from easier to harder to shape learning.</li>
          </ul>
        </section>

        <section>
          <h2>Modern foundation-model patterns</h2>
          <ul class="lesson-list two-column-list dense-list topic-detail-list">
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Retrieval-augmented_generation" target="_blank" rel="noopener noreferrer" title="Wikipedia: Retrieval-augmented generation">Retrieve then generate</a>:</strong> Finds external context before producing an answer.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Divide_and_conquer" target="_blank" rel="noopener noreferrer" title="Wikipedia: Divide and conquer">Decompose then solve</a>:</strong> Breaks a task into smaller subproblems before answering.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2305.20050" target="_blank" rel="noopener noreferrer" title="arXiv: Let's Verify Step by Step">Generate then verify</a>:</strong> Produces candidate answers and checks them with tests, critics, tools, or constraints.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Learning_to_rank" target="_blank" rel="noopener noreferrer" title="Wikipedia: Learning to rank">Generate then rank</a>:</strong> Samples candidates and selects the best one by score or preference.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2303.11366" target="_blank" rel="noopener noreferrer" title="arXiv: Reflexion">Propose then critique</a>:</strong> Creates a plan or answer, then reviews it for flaws.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2305.04091" target="_blank" rel="noopener noreferrer" title="arXiv: Plan-and-Solve Prompting">Plan then execute</a>:</strong> Builds an explicit sequence of actions before using tools or taking steps.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Mixture_of_experts" target="_blank" rel="noopener noreferrer" title="Wikipedia: Mixture of experts">Route then specialize</a>:</strong> Sends inputs to specialized models, tools, experts, prompts, or workflows.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2203.11171" target="_blank" rel="noopener noreferrer" title="arXiv: Self-Consistency Improves Chain of Thought Reasoning">Sample then vote</a>:</strong> Aggregates multiple sampled reasoning paths or answers.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2305.10601" target="_blank" rel="noopener noreferrer" title="arXiv: Tree of Thoughts">Search over reasoning traces</a>:</strong> Explores candidate chains of thought, plans, or proof paths before choosing one.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2302.04761" target="_blank" rel="noopener noreferrer" title="arXiv: Toolformer">Use tools for exact operations</a>:</strong> Delegates computation, lookup, code execution, retrieval, or structured actions to tools.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2005.11401" target="_blank" rel="noopener noreferrer" title="arXiv: Retrieval-Augmented Generation">Ground claims in external evidence</a>:</strong> Connects answers to retrieved documents, databases, citations, logs, or observations.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2210.03629" target="_blank" rel="noopener noreferrer" title="arXiv: ReAct">Maintain explicit state</a>:</strong> Stores task state, intermediate results, memory, or plans outside the model context alone.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Human-in-the-loop" target="_blank" rel="noopener noreferrer" title="Wikipedia: Human-in-the-loop">Escalate uncertain cases to humans</a>:</strong> Routes ambiguous, high-risk, or low-confidence cases to human review.</li>
          </ul>
        </section>

        <section>
          <h2>Scientific patterns</h2>
          <ul class="lesson-list two-column-list dense-list topic-detail-list">
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Benchmark_(computing)" target="_blank" rel="noopener noreferrer" title="Wikipedia: Benchmark (computing)">Establish a simple baseline</a>:</strong> Start with the simplest credible comparison before adding complexity.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Controlled_experiment" target="_blank" rel="noopener noreferrer" title="Wikipedia: Controlled experiment">Change one variable at a time</a>:</strong> Isolate causes by controlling all other factors.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Ablation_(artificial_intelligence)" target="_blank" rel="noopener noreferrer" title="Wikipedia: Ablation (artificial intelligence)">Run ablations</a>:</strong> Remove or vary components to test whether they actually matter.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Training,_validation,_and_test_data_sets" target="_blank" rel="noopener noreferrer" title="Wikipedia: Training, validation, and test data sets">Separate training and evaluation data</a>:</strong> Prevent evaluation from leaking into training or tuning.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Variance" target="_blank" rel="noopener noreferrer" title="Wikipedia: Variance">Measure variance across runs</a>:</strong> Check whether results survive random seeds, sampling, initialization, and data order.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Failure_mode_and_effects_analysis" target="_blank" rel="noopener noreferrer" title="Wikipedia: Failure mode and effects analysis">Inspect failures, not only averages</a>:</strong> Look at examples, slices, and edge cases behind aggregate metrics.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2108.13624" target="_blank" rel="noopener noreferrer" title="arXiv: Out-of-Distribution Generalization survey">Test out-of-distribution behaviour</a>:</strong> Evaluate whether behavior holds beyond the original data distribution.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Falsifiability" target="_blank" rel="noopener noreferrer" title="Wikipedia: Falsifiability">Attempt to falsify your own hypothesis</a>:</strong> Design tests that could prove your preferred explanation wrong.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Correlation_does_not_imply_causation" target="_blank" rel="noopener noreferrer" title="Wikipedia: Correlation does not imply causation">Distinguish correlation from causation</a>:</strong> Avoid treating predictive association as evidence of causal effect.</li>
          </ul>
        </section>

        <section>
          <h2>Why it matters for AI</h2>
          <p>
            AI techniques often look unrelated until you recognize the shared pattern underneath. A retrieval system, an agent workflow, an RL algorithm, a causal study, and a scientific paper can all use the same deeper moves: decompose, search, update, verify, compare, intervene, and measure.
          </p>
        </section>

        <section>
          <h2>Learning target</h2>
          <p>
            You should be able to recognize recurring reasoning, algorithmic, foundation-model, and scientific patterns, explain when each pattern is useful, and use them to read AI methods, design experiments, diagnose failures, and choose practical solution strategies.
          </p>
        </section>
