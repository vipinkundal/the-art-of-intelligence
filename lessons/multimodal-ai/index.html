    <template data-lesson-page data-eyebrow="Phase 17" data-title="17. Multimodal AI" data-summary="Native multimodality is now a core frontier topic, covering combinations of text, image, video, audio, action, and sensor inputs." data-article-class="phase-article">
        <section>
          <h2>Multimodal pipeline</h2>
          <div class="lesson-graphic" aria-label="Multimodal AI pipeline">
            <div class="graphic-flow">
              <div class="graphic-node">
                <strong>Encode</strong>
                <span>Turn text, images, audio, video, or actions into model-readable representations.</span>
              </div>
              <div class="graphic-node">
                <strong>Align and fuse</strong>
                <span>Connect representations so words, regions, sounds, and events can refer to each other.</span>
              </div>
              <div class="graphic-node">
                <strong>Ground output</strong>
                <span>Answer, retrieve, generate, or act while staying tied to visible or audible evidence.</span>
              </div>
            </div>
          </div>
        </section>

        <section>
          <h2>Learn</h2>
          <ul class="lesson-list two-column-list dense-list topic-detail-list">
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Contrastive_Language%E2%80%93Image_Pre-training" target="_blank" rel="noopener noreferrer" title="Wikipedia: Contrastive Language-Image Pre-training">Contrastive vision-language learning</a>:</strong> Trains image and text representations so matching pairs become close and mismatched pairs separate.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2103.00020" target="_blank" rel="noopener noreferrer" title="arXiv: Learning Transferable Visual Models From Natural Language Supervision">Image-text alignment</a>:</strong> Connects visual content with words, captions, labels, or instructions.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Vision_transformer" target="_blank" rel="noopener noreferrer" title="Wikipedia: Vision transformer">Vision encoders</a>:</strong> Convert images or frames into feature vectors or tokens for downstream reasoning.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2204.14198" target="_blank" rel="noopener noreferrer" title="arXiv: Flamingo">Projection layers</a>:</strong> Map outputs from one modality encoder into the shared space expected by another model.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Attention_(machine_learning)" target="_blank" rel="noopener noreferrer" title="Wikipedia: Attention (machine learning)">Cross-attention fusion</a>:</strong> Lets tokens from one modality attend to tokens from another modality.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Data_fusion" target="_blank" rel="noopener noreferrer" title="Wikipedia: Data fusion">Early, intermediate and late fusion</a>:</strong> Fuse modalities near the input, inside the model, or near the final decision.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/1711.00937" target="_blank" rel="noopener noreferrer" title="arXiv: Neural Discrete Representation Learning">Multimodal tokenization</a>:</strong> Represents non-text inputs as discrete tokens, patches, frames, or embeddings.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2304.08485" target="_blank" rel="noopener noreferrer" title="arXiv: Visual Instruction Tuning">Image and video instruction tuning</a>:</strong> Teaches models to follow natural-language instructions grounded in visual inputs.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Question_answering" target="_blank" rel="noopener noreferrer" title="Wikipedia: Question answering">Visual question answering</a>:</strong> Answers questions that require reading or reasoning over an image.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/1411.4555" target="_blank" rel="noopener noreferrer" title="arXiv: Show and Tell">Image captioning</a>:</strong> Generates text that describes the visible content of an image.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/1912.13318" target="_blank" rel="noopener noreferrer" title="arXiv: LayoutLM">Document understanding</a>:</strong> Combines OCR, layout, tables, figures, and text to interpret documents.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2212.04356" target="_blank" rel="noopener noreferrer" title="arXiv: Whisper">Speech-language models</a>:</strong> Connect spoken audio with transcription, dialogue, translation, or reasoning tasks.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2211.06687" target="_blank" rel="noopener noreferrer" title="arXiv: CLAP">Audio-language models</a>:</strong> Interpret sounds, music, events, or speech in relation to text.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Text-to-image_model" target="_blank" rel="noopener noreferrer" title="Wikipedia: Text-to-image model">Text-to-image generation</a>:</strong> Produces images conditioned on natural-language prompts or structured controls.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2204.03458" target="_blank" rel="noopener noreferrer" title="arXiv: Video Diffusion Models">Text-to-video generation</a>:</strong> Generates sequences of frames while maintaining temporal consistency.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2103.00020" target="_blank" rel="noopener noreferrer" title="arXiv: Learning Transferable Visual Models From Natural Language Supervision">Multimodal retrieval</a>:</strong> Searches across modalities, such as finding images from text or text from images.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Vision%E2%80%93language%E2%80%93action_model" target="_blank" rel="noopener noreferrer" title="Wikipedia: Vision–language–action model">Vision-language-action models</a>:</strong> Connect perception and instructions to actions in robotics or UI control.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2303.11381" target="_blank" rel="noopener noreferrer" title="arXiv: MM-REACT">Multimodal agents</a>:</strong> Use models, tools, memory, and perception to act across visual, textual, audio, or physical environments.</li>
          </ul>
        </section>

        <section>
          <h2>Important design questions</h2>
          <ul class="lesson-list two-column-list dense-list topic-detail-list">
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/1711.00937" target="_blank" rel="noopener noreferrer" title="arXiv: Neural Discrete Representation Learning">How are modalities tokenized?</a></strong> Tokenization determines what the model can see, compress, align, and generate.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/1705.09406" target="_blank" rel="noopener noreferrer" title="arXiv: Multimodal Machine Learning survey">Where are they fused?</a></strong> Fusion location affects compute cost, reasoning depth, and how strongly modalities influence each other.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2204.14198" target="_blank" rel="noopener noreferrer" title="arXiv: Flamingo">Are encoders frozen or trained jointly?</a></strong> Frozen encoders are cheaper and stable; joint training can improve alignment but costs more.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2102.05095" target="_blank" rel="noopener noreferrer" title="arXiv: TimeSformer">How is temporal information represented?</a></strong> Video and audio need ordering, duration, motion, and timing cues.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2305.10355" target="_blank" rel="noopener noreferrer" title="arXiv: Evaluating Object Hallucination in Large Vision-Language Models">How are grounding and hallucination evaluated?</a></strong> Evaluation must check whether outputs are supported by the actual image, video, audio, or document.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/1907.07603" target="_blank" rel="noopener noreferrer" title="arXiv: Visual Grounding survey">Does the model connect words to identifiable regions, sounds, or actions?</a></strong> Strong multimodal systems should tie language to evidence, not just plausible text.</li>
          </ul>
        </section>

        <section>
          <h2>Learning target</h2>
          <p>
            You should be able to compare alignment, fusion, tokenization, and grounding strategies across image-text, audio-language, video-language, and vision-language-action systems.
          </p>
