        <section>
          <h2>Uncertainty pipeline</h2>
          <div class="lesson-graphic" aria-label="Probabilistic AI inference flow">
            <div class="graphic-flow">
              <div class="graphic-node">
                <strong>Structure</strong>
                <span>Graphs describe which variables influence, explain, or depend on each other.</span>
              </div>
              <div class="graphic-node">
                <strong>Inference</strong>
                <span>Algorithms update hidden beliefs from noisy or incomplete evidence.</span>
              </div>
              <div class="graphic-node">
                <strong>State over time</strong>
                <span>Sequential models track changing hidden states behind observed signals.</span>
              </div>
            </div>
          </div>
        </section>

        <section>
          <h2>4.1 Probabilistic graphical models</h2>
          <p>Study:</p>
          <ul class="lesson-list two-column-list dense-list topic-detail-list">
            <li><strong><a class="wiki-term" href="topics/bayesian-networks/index.html">Bayesian networks</a>:</strong> Directed graphs that represent probabilistic cause-effect or dependency structure between variables.</li>
            <li><strong><a class="wiki-term" href="topics/markov-random-fields/index.html">Markov random fields</a>:</strong> Undirected graphs that model variables through local compatibility rather than directed causes.</li>
            <li><strong><a class="wiki-term" href="topics/factor-graphs/index.html">Factor graphs</a>:</strong> Bipartite graphs that separate variables from factor functions, making inference algorithms easier to express.</li>
            <li><strong><a class="wiki-term" href="topics/conditional-random-fields/index.html">Conditional random fields</a>:</strong> Discriminative graphical models that predict structured outputs conditioned on observed inputs.</li>
            <li><strong><a class="wiki-term" href="topics/conditional-independence/index.html">Conditional independence</a>:</strong> States when two variables become unrelated after another variable is known.</li>
            <li><strong><a class="wiki-term" href="topics/d-separation/index.html">D-separation</a>:</strong> A graph rule for reading conditional independence relationships from a Bayesian network.</li>
            <li><strong><a class="wiki-term" href="topics/exact-inference/index.html">Exact inference</a>:</strong> Computes posterior probabilities exactly, usually only feasible for smaller or structured graphs.</li>
            <li><strong><a class="wiki-term" href="topics/approximate-inference/index.html">Approximate inference</a>:</strong> Trades exactness for tractability using sampling, optimization, or message approximations.</li>
          </ul>
        </section>

        <section>
          <h2>Important algorithms</h2>
          <ul class="lesson-list two-column-list dense-list topic-detail-list">
            <li><strong><a class="wiki-term" href="topics/variable-elimination/index.html">Variable elimination</a>:</strong> Sums out hidden variables one at a time to answer probability queries.</li>
            <li><strong><a class="wiki-term" href="topics/sum-product-algorithm/index.html">Sum-product algorithm</a>:</strong> Passes messages to compute marginal probabilities efficiently on tree-structured graphs.</li>
            <li><strong><a class="wiki-term" href="topics/max-product-algorithm/index.html">Max-product algorithm</a>:</strong> Finds the most likely assignment instead of marginal probabilities.</li>
            <li><strong><a class="wiki-term" href="topics/belief-propagation/index.html">Belief propagation</a>:</strong> Updates local beliefs by passing messages between connected variables and factors.</li>
            <li><strong><a class="wiki-term" href="topics/loopy-belief-propagation/index.html">Loopy belief propagation</a>:</strong> Applies message passing to graphs with cycles, often useful but not always exact.</li>
            <li><strong><a class="wiki-term" href="topics/junction-tree-algorithm/index.html">Junction-tree algorithm</a>:</strong> Converts a graph into a tree of variable clusters to enable exact inference.</li>
            <li><strong><a class="wiki-term" href="topics/expectation-maximization/index.html">Expectation-maximization</a>:</strong> Alternates between estimating hidden variables and updating model parameters.</li>
            <li><strong><a class="wiki-term" href="topics/variational-inference/index.html">Variational inference</a>:</strong> Approximates a hard posterior with a simpler distribution found through optimization.</li>
            <li><strong><a class="wiki-term" href="topics/gibbs-sampling/index.html">Gibbs sampling</a>:</strong> Samples one variable at a time from its conditional distribution.</li>
            <li><strong><a class="wiki-term" href="topics/metropolis-hastings/index.html">Metropolis-Hastings</a>:</strong> Proposes random moves and accepts them with a probability that preserves the target distribution.</li>
            <li><strong><a class="wiki-term" href="topics/hamiltonian-monte-carlo/index.html">Hamiltonian Monte Carlo</a>:</strong> Uses gradient-informed proposals to explore continuous posteriors more efficiently.</li>
            <li><strong><a class="wiki-term" href="topics/sequential-monte-carlo/index.html">Sequential Monte Carlo</a>:</strong> Tracks a distribution over time using weighted particles and resampling.</li>
          </ul>
        </section>

        <section>
          <h2>4.2 Sequential models and state estimation</h2>
          <p>Learn:</p>
          <ul class="lesson-list two-column-list dense-list topic-detail-list">
            <li><strong><a class="wiki-term" href="topics/markov-chains/index.html">Markov chains</a>:</strong> Model state sequences where the next state depends only on the current state.</li>
            <li><strong><a class="wiki-term" href="topics/hidden-markov-models/index.html">Hidden Markov models</a>:</strong> Add hidden states that generate observations, useful when the true state is not directly visible.</li>
            <li><strong><a class="wiki-term" href="topics/forward-backward-algorithm/index.html">Forward-backward algorithm</a>:</strong> Computes smoothed probabilities over hidden states using past and future evidence.</li>
            <li><strong><a class="wiki-term" href="topics/viterbi-decoding/index.html">Viterbi decoding</a>:</strong> Finds the single most likely hidden-state path through a sequence.</li>
            <li><strong><a class="wiki-term" href="topics/kalman-filter/index.html">Kalman filter</a>:</strong> Tracks a linear-Gaussian hidden state as new noisy observations arrive.</li>
            <li><strong><a class="wiki-term" href="topics/extended-kalman-filter/index.html">Extended Kalman filter</a>:</strong> Linearizes nonlinear dynamics around the current estimate.</li>
            <li><strong><a class="wiki-term" href="topics/unscented-kalman-filter/index.html">Unscented Kalman filter</a>:</strong> Uses carefully chosen sample points to handle nonlinear transformations more accurately.</li>
            <li><strong><a class="wiki-term" href="topics/particle-filter/index.html">Particle filter</a>:</strong> Represents hidden-state uncertainty with weighted samples instead of a single Gaussian.</li>
            <li><strong><a class="wiki-term" href="topics/dynamic-bayesian-networks/index.html">Dynamic Bayesian networks</a>:</strong> Extend graphical models across time steps to represent temporal dependencies.</li>
          </ul>
        </section>

        <section>
          <h2>HMM joint distribution</h2>
          <div class="formula-display" aria-label="Hidden Markov model joint distribution">
            <code>p(z_1:T, x_1:T) = p(z_1) * product_{t=2..T} p(z_t | z_{t-1}) * product_{t=1..T} p(x_t | z_t)</code>
          </div>
        </section>

        <section>
          <h2>Kalman prediction</h2>
          <div class="formula-stack">
            <div class="formula-row">
              <span>State mean</span>
              <code>x_hat_{t|t-1} = A x_hat_{t-1|t-1} + B u_t</code>
            </div>
            <div class="formula-row">
              <span>State covariance</span>
              <code>P_{t|t-1} = A P_{t-1|t-1} A^T + Q</code>
            </div>
          </div>
        </section>

        <section>
          <h2>Learning target</h2>
          <p>
            You should be able to represent uncertainty with graphical models, choose an inference algorithm, explain how sequence models track hidden state over time, and recognize when filtering or smoothing is the right tool.
          </p>
