    <template data-lesson-page data-eyebrow="Phase 18" data-title="18. Reinforcement Learning" data-summary="Reinforcement learning studies agents that learn from rewards through bandits, Markov decision processes, value learning, policy gradients, actor-critic methods, model-based RL, offline RL, and imitation." data-article-class="phase-article">
        <section class="lesson-graphic" aria-labelledby="rl-loop-title">
          <h2 id="rl-loop-title">Reinforcement learning loop</h2>
          <div class="graphic-flow" aria-label="An agent observes a state, takes an action, receives reward and next state, then updates its policy or value estimate.">
            <div class="graphic-node">
              <strong>Observe state</strong>
              <span>The agent reads the situation it can perceive.</span>
            </div>
            <div class="graphic-node">
              <strong>Act and receive reward</strong>
              <span>An action changes the environment and produces feedback.</span>
            </div>
            <div class="graphic-node">
              <strong>Improve behavior</strong>
              <span>Values, policies, or world models update for future choices.</span>
            </div>
          </div>
        </section>

        <section>
          <h2>18.1 Foundations</h2>
          <p>Learn:</p>
          <ul class="lesson-list two-column-list dense-list topic-detail-list">
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Multi-armed_bandit" target="_blank" rel="noopener noreferrer" title="Wikipedia: Multi-armed bandit">Multi-armed bandits</a>:</strong> Model repeated choices where each option has an unknown reward distribution and no long-term state.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Markov_decision_process" target="_blank" rel="noopener noreferrer" title="Wikipedia: Markov decision process">Markov decision processes</a>:</strong> Formalize sequential decisions with states, actions, transition probabilities, rewards, and discounting.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Partially_observable_Markov_decision_process" target="_blank" rel="noopener noreferrer" title="Wikipedia: Partially observable Markov decision process">Partially observable MDPs</a>:</strong> Handle settings where the agent receives observations instead of the full hidden state.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Markov_decision_process" target="_blank" rel="noopener noreferrer" title="Wikipedia: Markov decision process">States, actions, rewards and transitions</a>:</strong> Define what the agent sees, what it can do, what feedback it receives, and how the world changes.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Reinforcement_learning" target="_blank" rel="noopener noreferrer" title="Wikipedia: Reinforcement learning">Policies</a>:</strong> Map states or observations to actions, either deterministically or as probabilities.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Reinforcement_learning" target="_blank" rel="noopener noreferrer" title="Wikipedia: Reinforcement learning">Returns</a>:</strong> Sum future rewards so the agent optimizes long-term outcome rather than only immediate feedback.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Discounting" target="_blank" rel="noopener noreferrer" title="Wikipedia: Discounting">Discounting</a>:</strong> Weighs near-term rewards more than distant rewards, often making infinite-horizon problems stable.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Value_function" target="_blank" rel="noopener noreferrer" title="Wikipedia: Value function">Value functions</a>:</strong> Estimate how much future return to expect from a state or state-action pair.</li>
            <li><strong><a class="wiki-term" href="https://spinningup.openai.com/en/latest/spinningup/rl_intro.html" target="_blank" rel="noopener noreferrer" title="OpenAI Spinning Up: Introduction to RL">Advantage functions</a>:</strong> Measure whether an action is better or worse than the usual value of the state.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Bellman_equation" target="_blank" rel="noopener noreferrer" title="Wikipedia: Bellman equation">Bellman equations</a>:</strong> Express values recursively as immediate reward plus discounted future value.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Exploration%E2%80%93exploitation_dilemma" target="_blank" rel="noopener noreferrer" title="Wikipedia: Exploration-exploitation dilemma">Exploration versus exploitation</a>:</strong> Balances trying uncertain actions against using the best-known action.</li>
          </ul>
          <p>Return:</p>
          <div class="formula-display">
            <code>G_t = sum_{k=0..infinity} gamma^k r_{t+k+1}</code>
          </div>
          <p>Bellman expectation equation:</p>
          <div class="formula-display">
            <code>V^pi(s) = E_pi[r + gamma V^pi(s') | s]</code>
          </div>
          <p>Bellman optimality equation:</p>
          <div class="formula-display">
            <code>Q*(s, a) = E[r + gamma max_a' Q*(s', a')]</code>
          </div>
        </section>

        <section>
          <h2>18.2 Bandits</h2>
          <p>Learn:</p>
          <ul class="lesson-list two-column-list dense-list topic-detail-list">
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Multi-armed_bandit" target="_blank" rel="noopener noreferrer" title="Wikipedia: Multi-armed bandit">epsilon-greedy</a>:</strong> Usually picks the best-known action but sometimes explores randomly.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Multi-armed_bandit" target="_blank" rel="noopener noreferrer" title="Wikipedia: Multi-armed bandit">Upper-confidence bound</a>:</strong> Chooses actions using both estimated reward and uncertainty about that estimate.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Thompson_sampling" target="_blank" rel="noopener noreferrer" title="Wikipedia: Thompson sampling">Thompson sampling</a>:</strong> Samples from a belief distribution over action quality, naturally exploring uncertain options.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Multi-armed_bandit" target="_blank" rel="noopener noreferrer" title="Wikipedia: Multi-armed bandit">Contextual bandits</a>:</strong> Use side information about the current user, item, or situation before choosing an action.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Thompson_sampling" target="_blank" rel="noopener noreferrer" title="Wikipedia: Thompson sampling">Bayesian bandits</a>:</strong> Maintain probability distributions over unknown rewards and update them as evidence arrives.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Multi-armed_bandit" target="_blank" rel="noopener noreferrer" title="Wikipedia: Multi-armed bandit">Regret analysis</a>:</strong> Measures how much reward was lost compared with always choosing the best action in hindsight.</li>
          </ul>
        </section>

        <section>
          <h2>18.3 Tabular reinforcement learning</h2>
          <p>Study:</p>
          <ul class="lesson-list two-column-list dense-list topic-detail-list">
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Dynamic_programming" target="_blank" rel="noopener noreferrer" title="Wikipedia: Dynamic programming">Dynamic programming</a>:</strong> Solves MDPs by using known transition and reward models to update values exactly.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Program_evaluation" target="_blank" rel="noopener noreferrer" title="Wikipedia: Program evaluation">Policy evaluation</a>:</strong> Computes how good a fixed policy is before trying to improve it.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Markov_decision_process" target="_blank" rel="noopener noreferrer" title="Wikipedia: Markov decision process">Policy iteration</a>:</strong> Alternates evaluating a policy and making it greedier with respect to its values.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Markov_decision_process" target="_blank" rel="noopener noreferrer" title="Wikipedia: Markov decision process">Value iteration</a>:</strong> Repeatedly applies the Bellman optimality update until values imply a strong policy.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Monte_Carlo_method" target="_blank" rel="noopener noreferrer" title="Wikipedia: Monte Carlo method">Monte Carlo prediction and control</a>:</strong> Learns from complete sampled episodes rather than a known model.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Temporal_difference_learning" target="_blank" rel="noopener noreferrer" title="Wikipedia: Temporal difference learning">Temporal-difference learning</a>:</strong> Updates estimates from partial experience using bootstrapped predictions.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Temporal_difference_learning" target="_blank" rel="noopener noreferrer" title="Wikipedia: Temporal difference learning">TD(0)</a>:</strong> Updates a value estimate one step at a time using the next state's estimate.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Temporal_difference_learning" target="_blank" rel="noopener noreferrer" title="Wikipedia: Temporal difference learning">TD(lambda)</a>:</strong> Blends short and long credit assignment through eligibility traces.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/State%E2%80%93action%E2%80%93reward%E2%80%93state%E2%80%93action" target="_blank" rel="noopener noreferrer" title="Wikipedia: SARSA">SARSA</a>:</strong> Learns action values for the policy actually being followed, including its exploration behavior.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Q-learning" target="_blank" rel="noopener noreferrer" title="Wikipedia: Q-learning">Q-learning</a>:</strong> Learns optimal action values off-policy by bootstrapping from the best next action.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Temporal_difference_learning" target="_blank" rel="noopener noreferrer" title="Wikipedia: Temporal difference learning">Eligibility traces</a>:</strong> Keep temporary credit for recently visited states or actions so rewards can update them together.</li>
          </ul>
          <p>Q-learning:</p>
          <div class="formula-display">
            <code>Q(s, a) &lt;- Q(s, a) + alpha [r + gamma max_a' Q(s', a') - Q(s, a)]</code>
          </div>
        </section>

        <section>
          <h2>18.4 Deep reinforcement learning</h2>
          <p>Value-based:</p>
          <ul class="lesson-list two-column-list dense-list topic-detail-list">
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Q-learning" target="_blank" rel="noopener noreferrer" title="Wikipedia: Q-learning">DQN</a>:</strong> Uses a neural network to approximate Q-values for high-dimensional observations such as pixels.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/1509.06461" target="_blank" rel="noopener noreferrer" title="arXiv: Deep Reinforcement Learning with Double Q-learning">Double DQN</a>:</strong> Reduces overestimation by separating action selection from action evaluation.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/1511.06581" target="_blank" rel="noopener noreferrer" title="arXiv: Dueling Network Architectures for Deep Reinforcement Learning">Dueling DQN</a>:</strong> Splits value and advantage streams so the network can learn state value separately from action preference.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/1511.05952" target="_blank" rel="noopener noreferrer" title="arXiv: Prioritized Experience Replay">Prioritized replay</a>:</strong> Reuses important or surprising experiences more often during training.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/1707.06887" target="_blank" rel="noopener noreferrer" title="arXiv: A Distributional Perspective on Reinforcement Learning">Distributional RL</a>:</strong> Predicts a distribution of returns instead of only the expected return.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Rainbow" target="_blank" rel="noopener noreferrer" title="Wikipedia: Rainbow">Rainbow</a>:</strong> Combines several DQN improvements into one stronger value-based agent.</li>
          </ul>
          <p>Policy-based:</p>
          <ul class="lesson-list two-column-list dense-list topic-detail-list">
            <li><strong><a class="wiki-term" href="https://link.springer.com/article/10.1007/BF00992696" target="_blank" rel="noopener noreferrer" title="Machine Learning: Simple statistical gradient-following algorithms for connectionist reinforcement learning">REINFORCE</a>:</strong> Estimates policy gradients from sampled returns and directly increases probability of rewarding actions.</li>
            <li><strong><a class="wiki-term" href="https://proceedings.neurips.cc/paper/2001/hash/4b86abe48d358ecf194c56c69108433e-Abstract.html" target="_blank" rel="noopener noreferrer" title="NeurIPS: A Natural Policy Gradient">Natural policy gradient</a>:</strong> Scales updates by the geometry of the policy distribution for more stable steps.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/1502.05477" target="_blank" rel="noopener noreferrer" title="arXiv: Trust Region Policy Optimization">TRPO</a>:</strong> Limits each policy update so the new policy stays close to the old one.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Proximal_policy_optimization" target="_blank" rel="noopener noreferrer" title="Wikipedia: Proximal policy optimization">PPO</a>:</strong> Uses a clipped objective to get much of TRPO's stability with simpler implementation.</li>
          </ul>
          <p>Actor-critic:</p>
          <ul class="lesson-list two-column-list dense-list topic-detail-list">
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/1602.01783" target="_blank" rel="noopener noreferrer" title="arXiv: Asynchronous Methods for Deep Reinforcement Learning">A2C</a>:</strong> Trains an actor policy with a critic value estimate in synchronized batches.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/1602.01783" target="_blank" rel="noopener noreferrer" title="arXiv: Asynchronous Methods for Deep Reinforcement Learning">A3C</a>:</strong> Runs multiple asynchronous workers so diverse experience stabilizes learning.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/1509.02971" target="_blank" rel="noopener noreferrer" title="arXiv: Continuous control with deep reinforcement learning">DDPG</a>:</strong> Extends actor-critic learning to continuous actions with deterministic policies.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/1802.09477" target="_blank" rel="noopener noreferrer" title="arXiv: Addressing Function Approximation Error in Actor-Critic Methods">TD3</a>:</strong> Improves DDPG with clipped double critics, delayed policy updates, and target smoothing.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/1801.01290" target="_blank" rel="noopener noreferrer" title="arXiv: Soft Actor-Critic">SAC</a>:</strong> Optimizes both reward and policy entropy, encouraging robust exploration in continuous control.</li>
          </ul>
          <p>Policy-gradient theorem:</p>
          <div class="formula-display">
            <code>grad_theta J(theta) = E_pi_theta[grad_theta log pi_theta(a | s) Q^pi_theta(s, a)]</code>
          </div>
          <p>PPO clipped objective:</p>
          <div class="formula-display">
            <code>L_CLIP = E_t[min(r_t(theta) A_hat_t, clip(r_t(theta), 1 - epsilon, 1 + epsilon) A_hat_t)]</code>
          </div>
        </section>

        <section>
          <h2>18.5 Advanced reinforcement learning</h2>
          <p>Learn:</p>
          <ul class="lesson-list two-column-list dense-list topic-detail-list">
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Reinforcement_learning" target="_blank" rel="noopener noreferrer" title="Wikipedia: Reinforcement learning">Model-based RL</a>:</strong> Learns or uses a model of environment dynamics to plan before acting.</li>
            <li><strong><a class="wiki-term" href="http://incompleteideas.net/book/the-book-2nd.html" target="_blank" rel="noopener noreferrer" title="Reinforcement Learning: An Introduction">Dyna</a>:</strong> Mixes real experience with simulated experience generated from a learned model.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/1803.10122" target="_blank" rel="noopener noreferrer" title="arXiv: World Models">Learned world models</a>:</strong> Predict future observations, states, or rewards so agents can imagine rollouts.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Model_predictive_control" target="_blank" rel="noopener noreferrer" title="Wikipedia: Model predictive control">Model-predictive control</a>:</strong> Plans over a short horizon, executes the first action, then replans.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2005.01643" target="_blank" rel="noopener noreferrer" title="arXiv: Offline Reinforcement Learning survey">Offline RL</a>:</strong> Learns policies from fixed logged data without additional environment interaction.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2006.04779" target="_blank" rel="noopener noreferrer" title="arXiv: Conservative Q-Learning">Conservative Q-learning</a>:</strong> Penalizes over-optimistic values for unseen actions in offline datasets.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2110.06169" target="_blank" rel="noopener noreferrer" title="arXiv: Offline Reinforcement Learning with Implicit Q-Learning">Implicit Q-learning</a>:</strong> Learns from offline data without explicitly maximizing over actions outside the dataset.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2006.09359" target="_blank" rel="noopener noreferrer" title="arXiv: Advantage Weighted Actor-Critic">Advantage-weighted actor-critic</a>:</strong> Imitates dataset actions more strongly when their estimated advantage is high.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Imitation_learning" target="_blank" rel="noopener noreferrer" title="Wikipedia: Imitation learning">Imitation learning</a>:</strong> Learns behavior from demonstrations rather than reward trial and error alone.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Imitation_learning" target="_blank" rel="noopener noreferrer" title="Wikipedia: Imitation learning">Behaviour cloning</a>:</strong> Trains a policy as supervised learning from expert state-action examples.</li>
            <li><strong><a class="wiki-term" href="https://proceedings.mlr.press/v15/ross11a.html" target="_blank" rel="noopener noreferrer" title="PMLR: A Reduction of Imitation Learning and Structured Prediction to No-Regret Online Learning">DAgger</a>:</strong> Collects expert corrections on the learner's visited states to reduce compounding mistakes.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Inverse_reinforcement_learning" target="_blank" rel="noopener noreferrer" title="Wikipedia: Inverse reinforcement learning">Inverse RL</a>:</strong> Infers a reward function that would make expert behavior look rational.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/1606.03476" target="_blank" rel="noopener noreferrer" title="arXiv: Generative Adversarial Imitation Learning">GAIL</a>:</strong> Uses adversarial training to make learner behavior indistinguishable from demonstrations.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Reinforcement_learning" target="_blank" rel="noopener noreferrer" title="Wikipedia: Reinforcement learning">Hierarchical RL</a>:</strong> Learns high-level skills or subgoals that organize lower-level actions.</li>
            <li><strong><a class="wiki-term" href="http://incompleteideas.net/book/the-book-2nd.html" target="_blank" rel="noopener noreferrer" title="Reinforcement Learning: An Introduction">Options</a>:</strong> Represent temporally extended actions with an initiation set, internal policy, and termination rule.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Meta-learning_(computer_science)" target="_blank" rel="noopener noreferrer" title="Wikipedia: Meta-learning (computer science)">Meta-RL</a>:</strong> Trains agents to adapt quickly to new tasks from limited experience.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Multi-agent_system" target="_blank" rel="noopener noreferrer" title="Wikipedia: Multi-agent system">Multi-agent RL</a>:</strong> Studies learning when multiple agents interact, cooperate, or compete.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/1803.11485" target="_blank" rel="noopener noreferrer" title="arXiv: QMIX">QMIX</a>:</strong> Learns decentralized agent policies with a centralized value decomposition during training.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/1706.02275" target="_blank" rel="noopener noreferrer" title="arXiv: Multi-Agent Actor-Critic for Mixed Cooperative-Competitive Environments">MADDPG</a>:</strong> Extends actor-critic methods to multiple agents with centralized critics.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Self-play" target="_blank" rel="noopener noreferrer" title="Wikipedia: Self-play">Self-play</a>:</strong> Generates increasingly challenging opponents or partners from the agent's own past policies.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Curriculum_learning" target="_blank" rel="noopener noreferrer" title="Wikipedia: Curriculum learning">Curriculum learning</a>:</strong> Orders tasks from easier to harder so policies build useful capabilities gradually.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/1705.10528" target="_blank" rel="noopener noreferrer" title="arXiv: Constrained Policy Optimization">Safe RL</a>:</strong> Tries to maximize reward while avoiding unacceptable harm, constraint violations, or unsafe exploration.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Markov_decision_process" target="_blank" rel="noopener noreferrer" title="Wikipedia: Markov decision process">Constrained MDPs</a>:</strong> Add cost constraints to the MDP so optimization must satisfy safety or resource limits.</li>
          </ul>
        </section>

        <section>
          <h2>Learning target</h2>
          <p>
            You should be able to formulate an RL problem, derive the core Bellman and policy-gradient updates, choose between value-based, policy-based, actor-critic, model-based, offline, imitation, and multi-agent methods, and explain their exploration and stability tradeoffs.
          </p>
