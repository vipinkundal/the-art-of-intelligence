    <template data-lesson-page data-eyebrow="Phase 27" data-title="27. Representative Research-Paper Sequence" data-summary="This is a curated backbone, not a claim that these are the only important papers. Use it to connect the methods in the roadmap to representative research artifacts, historical turning points, and modern systems work." data-article-class="phase-article">
        <section>
          <h2>How to read the sequence</h2>
          <div class="lesson-graphic" aria-label="Research-paper reading sequence">
            <div class="graphic-flow">
              <div class="graphic-node">
                <strong>Trace the idea</strong>
                <span>Read papers as a sequence of problems, assumptions, datasets, objectives, and architectural choices.</span>
              </div>
              <div class="graphic-node">
                <strong>Compare the claim</strong>
                <span>Ask what changed relative to earlier baselines: data, scale, optimization, inference, or system design.</span>
              </div>
              <div class="graphic-node">
                <strong>Extract the pattern</strong>
                <span>Turn each paper into reusable concepts, failure modes, and implementation questions.</span>
              </div>
            </div>
          </div>
        </section>

        <section>
          <h2>Foundations</h2>
          <ol class="lesson-list dense-list topic-detail-list paper-sequence-list">
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Perceptron" target="_blank" rel="noopener noreferrer" title="Wikipedia: Perceptron">The Perceptron</a>:</strong> Establishes the early linear-threshold view of machine learning.</li>
            <li><strong><a class="wiki-term" href="https://www.nature.com/articles/323533a0" target="_blank" rel="noopener noreferrer" title="Nature: Learning representations by back-propagating errors">Learning Representations by Back-Propagating Errors</a>:</strong> Makes gradient-based multilayer neural-network training practical.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Support_vector_machine" target="_blank" rel="noopener noreferrer" title="Wikipedia: Support vector machine">Support-Vector Networks</a>:</strong> Shows large-margin kernel methods as a powerful supervised-learning paradigm.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Random_forest" target="_blank" rel="noopener noreferrer" title="Wikipedia: Random forest">Random Forests</a>:</strong> Demonstrates the strength of averaging randomized decision trees.</li>
            <li><strong><a class="wiki-term" href="https://en.wikipedia.org/wiki/Gradient_boosting" target="_blank" rel="noopener noreferrer" title="Wikipedia: Gradient boosting">Gradient Boosting Machine</a>:</strong> Frames boosting as stage-wise function optimization.</li>
            <li><strong><a class="wiki-term" href="https://proceedings.neurips.cc/paper/2012/hash/c399862d3b9d6b76c8436e924a68c45b-Abstract.html" target="_blank" rel="noopener noreferrer" title="NeurIPS: ImageNet Classification with Deep Convolutional Neural Networks">ImageNet Classification with Deep Convolutional Neural Networks</a>:</strong> Marks the modern deep-learning breakthrough on large-scale vision.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/1512.03385" target="_blank" rel="noopener noreferrer" title="arXiv: Deep Residual Learning for Image Recognition">Deep Residual Learning for Image Recognition</a>:</strong> Introduces residual connections as a practical way to train very deep networks.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/1301.3781" target="_blank" rel="noopener noreferrer" title="arXiv: Efficient Estimation of Word Representations in Vector Space">Efficient Estimation of Word Representations in Vector Space</a>:</strong> Popularizes scalable word embeddings and distributional representation learning.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/1409.3215" target="_blank" rel="noopener noreferrer" title="arXiv: Sequence to Sequence Learning with Neural Networks">Sequence to Sequence Learning with Neural Networks</a>:</strong> Shows encoder-decoder neural models for variable-length sequence transduction.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/1409.0473" target="_blank" rel="noopener noreferrer" title="arXiv: Neural Machine Translation by Jointly Learning to Align and Translate">Neural Machine Translation by Jointly Learning to Align and Translate</a>:</strong> Introduces attention as a learned alignment mechanism for translation.</li>
          </ol>
        </section>

        <section>
          <h2>Transformers and language models</h2>
          <ol class="lesson-list dense-list topic-detail-list paper-sequence-list" start="11">
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/1706.03762" target="_blank" rel="noopener noreferrer" title="arXiv: Attention Is All You Need">Attention Is All You Need</a>:</strong> Replaces recurrence with transformer attention as the central sequence-modeling architecture.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/1810.04805" target="_blank" rel="noopener noreferrer" title="arXiv: BERT">BERT</a>:</strong> Shows the power of bidirectional masked-language-model pretraining for language understanding.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2005.14165" target="_blank" rel="noopener noreferrer" title="arXiv: Language Models are Few-Shot Learners">Language Models are Few-Shot Learners</a>:</strong> Demonstrates broad task transfer through scale and prompting.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2001.08361" target="_blank" rel="noopener noreferrer" title="arXiv: Scaling Laws for Neural Language Models">Scaling Laws for Neural Language Models</a>:</strong> Studies predictable relationships between loss, data, parameters, and compute.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2203.15556" target="_blank" rel="noopener noreferrer" title="arXiv: Training Compute-Optimal Large Language Models">Training Compute-Optimal Large Language Models</a>:</strong> Rebalances model size and data size for efficient language-model scaling.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2205.14135" target="_blank" rel="noopener noreferrer" title="arXiv: FlashAttention">FlashAttention</a>:</strong> Shows that exact attention can be made much faster through IO-aware implementation.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2101.03961" target="_blank" rel="noopener noreferrer" title="arXiv: Switch Transformers">Switch Transformers</a>:</strong> Uses sparse mixture-of-experts routing to scale parameter count efficiently.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2106.09685" target="_blank" rel="noopener noreferrer" title="arXiv: LoRA">LoRA</a>:</strong> Introduces low-rank adaptation as a parameter-efficient fine-tuning method.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2005.11401" target="_blank" rel="noopener noreferrer" title="arXiv: Retrieval-Augmented Generation">Retrieval-Augmented Generation</a>:</strong> Combines parametric language models with retrieved non-parametric memory.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2203.02155" target="_blank" rel="noopener noreferrer" title="arXiv: Training language models to follow instructions with human feedback">Training Language Models to Follow Instructions with Human Feedback</a>:</strong> Establishes instruction tuning and human-feedback alignment as a practical post-training recipe.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2305.18290" target="_blank" rel="noopener noreferrer" title="arXiv: Direct Preference Optimization">Direct Preference Optimization</a>:</strong> Optimizes preferences directly without an explicit reinforcement-learning loop.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2210.03629" target="_blank" rel="noopener noreferrer" title="arXiv: ReAct">ReAct</a>:</strong> Interleaves reasoning traces with tool or environment actions.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2302.04761" target="_blank" rel="noopener noreferrer" title="arXiv: Toolformer">Toolformer</a>:</strong> Teaches a language model when and how to call external tools.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2408.03314" target="_blank" rel="noopener noreferrer" title="arXiv: Scaling LLM Test-Time Compute Optimally">Test-Time Compute or inference-scaling work</a>:</strong> Represents the line of work showing that spending more compute at inference can improve reasoning quality.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2501.12948" target="_blank" rel="noopener noreferrer" title="arXiv: DeepSeek-R1">DeepSeek-R1</a>:</strong> Represents recent reasoning-model work based on reinforcement learning and long-form reasoning behavior.</li>
          </ol>
          <p>
            RAG, DPO, ReAct, Toolformer, reasoning-time computation, and DeepSeek-R1 are representative of topics now appearing in current language-model curricula.
          </p>
        </section>

        <section>
          <h2>Vision and multimodality</h2>
          <ol class="lesson-list dense-list topic-detail-list paper-sequence-list" start="26">
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/1409.1556" target="_blank" rel="noopener noreferrer" title="arXiv: Very Deep Convolutional Networks">Very Deep Convolutional Networks</a>:</strong> Shows the value of simple, deep convolutional stacks for visual recognition.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2010.11929" target="_blank" rel="noopener noreferrer" title="arXiv: Vision Transformer">Vision Transformer</a>:</strong> Applies transformer-style patch tokenization and attention to images.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2103.00020" target="_blank" rel="noopener noreferrer" title="arXiv: CLIP">Learning Transferable Visual Models From Natural Language Supervision</a>:</strong> Connects vision and language through contrastive pretraining.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2002.05709" target="_blank" rel="noopener noreferrer" title="arXiv: SimCLR">A Simple Framework for Contrastive Learning</a>:</strong> Presents a clean contrastive-learning recipe for visual representation learning.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2111.06377" target="_blank" rel="noopener noreferrer" title="arXiv: Masked Autoencoders">Masked Autoencoders Are Scalable Vision Learners</a>:</strong> Uses masked reconstruction to train strong vision representations.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2005.12872" target="_blank" rel="noopener noreferrer" title="arXiv: DETR">Detection Transformer</a>:</strong> Recasts object detection as set prediction with transformers.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2304.02643" target="_blank" rel="noopener noreferrer" title="arXiv: Segment Anything">Segment Anything</a>:</strong> Builds a promptable foundation model for image segmentation.</li>
          </ol>
        </section>

        <section>
          <h2>Generative models</h2>
          <ol class="lesson-list dense-list topic-detail-list paper-sequence-list" start="33">
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/1312.6114" target="_blank" rel="noopener noreferrer" title="arXiv: Auto-Encoding Variational Bayes">Auto-Encoding Variational Bayes</a>:</strong> Introduces the variational autoencoder training objective.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/1406.2661" target="_blank" rel="noopener noreferrer" title="arXiv: Generative Adversarial Nets">Generative Adversarial Nets</a>:</strong> Frames generation as a game between a generator and discriminator.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2006.11239" target="_blank" rel="noopener noreferrer" title="arXiv: Denoising Diffusion Probabilistic Models">Denoising Diffusion Probabilistic Models</a>:</strong> Makes denoising diffusion a practical high-quality generative modeling framework.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2011.13456" target="_blank" rel="noopener noreferrer" title="arXiv: Score-Based Generative Modeling through SDEs">Score-Based Generative Modeling through Stochastic Differential Equations</a>:</strong> Connects score models, diffusion processes, and SDE-based sampling.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2210.02747" target="_blank" rel="noopener noreferrer" title="arXiv: Flow Matching for Generative Modeling">Flow Matching for Generative Modeling</a>:</strong> Presents simulation-free training for continuous normalizing flows.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2212.09748" target="_blank" rel="noopener noreferrer" title="arXiv: Scalable Diffusion Models with Transformers">Scalable Diffusion Models with Transformers</a>:</strong> Uses transformer backbones for scalable diffusion generation.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2112.10752" target="_blank" rel="noopener noreferrer" title="arXiv: Latent Diffusion Models">Latent Diffusion Models</a>:</strong> Moves diffusion into a compressed latent space for efficient high-resolution generation.</li>
          </ol>
        </section>

        <section>
          <h2>Reinforcement learning</h2>
          <ol class="lesson-list dense-list topic-detail-list paper-sequence-list" start="40">
            <li><strong><a class="wiki-term" href="https://www.nature.com/articles/nature14236" target="_blank" rel="noopener noreferrer" title="Nature: Human-level control through deep reinforcement learning">Human-Level Control through Deep Reinforcement Learning</a>:</strong> Combines deep Q-learning with Atari-scale visual control.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/1502.05477" target="_blank" rel="noopener noreferrer" title="arXiv: Trust Region Policy Optimization">Trust Region Policy Optimization</a>:</strong> Constrains policy updates to improve stability.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/1707.06347" target="_blank" rel="noopener noreferrer" title="arXiv: Proximal Policy Optimization Algorithms">Proximal Policy Optimization Algorithms</a>:</strong> Provides a simpler clipped-objective policy-gradient method.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/1801.01290" target="_blank" rel="noopener noreferrer" title="arXiv: Soft Actor-Critic">Soft Actor-Critic</a>:</strong> Optimizes both reward and policy entropy for robust continuous control.</li>
            <li><strong><a class="wiki-term" href="https://www.nature.com/articles/nature24270" target="_blank" rel="noopener noreferrer" title="Nature: Mastering the game of Go without human knowledge">Mastering the Game of Go without Human Knowledge</a>:</strong> Shows self-play reinforcement learning reaching superhuman Go performance without human examples.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/1712.01815" target="_blank" rel="noopener noreferrer" title="arXiv: Mastering Chess and Shogi by Self-Play">Mastering Chess and Shogi by Self-Play</a>:</strong> Extends self-play reinforcement learning across multiple board games.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2006.04779" target="_blank" rel="noopener noreferrer" title="arXiv: Conservative Q-Learning">Conservative Q-Learning</a>:</strong> Addresses overestimation and distribution shift in offline reinforcement learning.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2106.01345" target="_blank" rel="noopener noreferrer" title="arXiv: Decision Transformer">Decision Transformer</a>:</strong> Treats reinforcement learning trajectories as sequence modeling.</li>
          </ol>
        </section>

        <section>
          <h2>Graphs, sequence alternatives and interpretability</h2>
          <ol class="lesson-list dense-list topic-detail-list paper-sequence-list" start="48">
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/1609.02907" target="_blank" rel="noopener noreferrer" title="arXiv: Semi-Supervised Classification with Graph Convolutional Networks">Semi-Supervised Classification with Graph Convolutional Networks</a>:</strong> Introduces a widely used graph convolutional network formulation.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/1710.10903" target="_blank" rel="noopener noreferrer" title="arXiv: Graph Attention Networks">Graph Attention Networks</a>:</strong> Adds attention-based neighbor aggregation to graph neural networks.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/1810.00826" target="_blank" rel="noopener noreferrer" title="arXiv: How Powerful Are Graph Neural Networks?">How Powerful Are Graph Neural Networks?</a></strong> Analyzes expressive limits and motivates the graph isomorphism network.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2111.00396" target="_blank" rel="noopener noreferrer" title="arXiv: Efficiently Modeling Long Sequences with Structured State Spaces">Efficiently Modeling Long Sequences with Structured State Spaces</a>:</strong> Shows structured state-space models as efficient long-sequence alternatives.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2312.00752" target="_blank" rel="noopener noreferrer" title="arXiv: Mamba">Mamba</a>:</strong> Uses selective state-space updates as an attention alternative for long sequences.</li>
            <li><strong><a class="wiki-term" href="https://transformer-circuits.pub/" target="_blank" rel="noopener noreferrer" title="Transformer Circuits">Transformer Circuits and subsequent mechanistic-interpretability work</a>:</strong> Represents the program of reverse-engineering transformer internals.</li>
            <li><strong><a class="wiki-term" href="https://arxiv.org/abs/2304.14997" target="_blank" rel="noopener noreferrer" title="arXiv: Towards Automated Circuit Discovery for Mechanistic Interpretability">Automated circuit-discovery research</a>:</strong> Represents work that tries to identify model circuits at scale.</li>
          </ol>
        </section>

        <section>
          <h2>Why it matters for AI</h2>
          <p>
            A paper sequence gives the roadmap historical texture. It helps you see which ideas are algorithmic, which are scaling results, which are systems contributions, and which are experimental recipes that changed what practitioners could build.
          </p>
        </section>

        <section>
          <h2>Learning target</h2>
          <p>
            You should be able to place representative AI papers into a rough sequence, explain the main contribution of each cluster, connect papers to roadmap topics, and use the sequence to choose what to read next.
          </p>
        </section>
